    <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก">
      <div class="brand">
        <div class="brand-logo"><svg class="i lg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></div>

      </main>
    </div>

  <script>
    (function () {
      function show(title, msg) {
        var c = document.getElementById('content'), t = document.getElementById('page-title');
        if (t) t.textContent = 'เกิดข้อผิดพลาด';
        if (c) c.innerHTML = '<div style="max-width:720px;margin:40px auto;padding:20px 22px;border:1px solid #e05252;border-radius:14px;background:rgba(224,82,82,.08)">' +
          '<b style="color:#e05252;font-size:17px">' + title + '</b><pre style="white-space:pre-wrap;font-size:13px;margin:10px 0">' +
          String(msg).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>' +
          '<div style="font-size:14px;line-height:1.7">ตรวจสอบ: (1) วางไฟล์ <b>Index.html</b> ครบทั้งไฟล์ (2) วาง <b>Code.gs</b> ครบ (3) รัน setup แล้ว Deploy เวอร์ชันใหม่ แล้วกด F5</div></div>';
      }
      window.addEventListener('error', function (e) {
        if (window.__rvLoaded) return;
        show('สคริปต์หน้าเว็บทำงานไม่ได้', (e.message || 'Script error') + (e.lineno ? '\nบรรทัด ' + e.lineno + ':' + e.colno : ''));
      });
      setTimeout(function () {
        if (window.__rvLoaded) return;
        show(window.__rvBooted ? 'เซิร์ฟเวอร์ไม่ตอบกลับภายใน 30 วินาที' : 'สคริปต์หน้าเว็บไม่เริ่มทำงาน',
          window.__rvBooted ? 'ลองรันฟังก์ชัน setup ใน Apps Script อีกครั้ง แล้วดู "การดำเนินการ" (Executions)' : 'สคริปต์ส่วนท้ายของ Index.html ไม่ถูกโหลด — มักเกิดจากวางโค้ดไม่ครบ');
      }, 30000);
    })();
  </script>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <?!= include('App') ?>
