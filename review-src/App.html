/* ---------------- เรียกเซิร์ฟเวอร์ ---------------- */
let busyCount = 0;
function busy(on) { busyCount += on ? 1 : -1; $('#busy').classList.toggle('on', busyCount > 0); }
function call(action, payload, quiet) {
  busy(true);
  const p = Object.assign({}, payload || {});
  const as = ss.get('rv-as'), role = ss.get('rv-role');
  if (as) p._as = as;
  if (role) p._role = role;
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => {
        busy(false);
        if (!r || !r.ok) { const e = new Error(r ? r.error : 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ'); e.sourceError = r && r.sourceError; e.shown = !quiet; if (!quiet) toast(e.message, 'err'); return reject(e); }
        resolve(r.data);
      })
      .withFailureHandler(err => { busy(false); const e = new Error(err && err.message ? err.message : String(err)); e.shown = true; toast(e.message, 'err'); reject(e); })
      .api(action, p);
  });
}
const run = fn => Promise.resolve().then(fn).catch(e => { if (!e.shown) { console.error(e); toast(e.message, 'err'); } });

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = ic(kind === 'err' ? 'bad' : kind === 'ok' ? 'ok' : 'info') + '<span class="pre">' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 8000 : 3500);
}

/* ---------------- ตัวช่วยแสดงผล ---------------- */
const B = () => S.boot;
const U = () => S.boot.user;
const M = () => S.boot.meta;
const role = () => U().role;
const initial = n => String(n || '?').trim().replace(/^[\u0E40-\u0E44]/, '').charAt(0) || '?';
const unitName = c => { const u = (B().units || []).find(x => x.code === c); return u ? u.name : c || '—'; };

function thaiDate(iso, withTime) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d)) return esc(iso);
  const m = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const s = d.getDate() + ' ' + m[d.getMonth()] + ' ' + (d.getFullYear() + 543);
  return withTime && /T/.test(iso) ? s + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' น.' : s;
}
const days = n => n === null || n === undefined ? '—' : (Math.round(n * 10) / 10) + ' วัน';

const STATUS_STYLE = {
  draft: ['gray', 'edit'], submitted: ['blue', 'inbox'], in_review: ['purple', 'search'], returned: ['amber', 'undo'],
  pending_decision: ['gold', 'gavel'], decided: ['teal', 'check'], closed: ['green', 'ok'], cancelled: ['red', 'x']
};
function statusBadge(st) {
  const s = STATUS_STYLE[st] || ['gray', 'info'];
  return `<span class="badge ${s[0]}">${ic(s[1], 'sm')}${esc((M().statuses[st] || {}).label || st)}</span>`;
}
function resultBadge(r) {
  const map = { pass: ['ok', 'ผ่านเกณฑ์'], fail: ['bad', 'ไม่ผ่านเกณฑ์'], inconclusive: ['q', 'ยังสรุปไม่ได้'] };
  const m = map[r] || ['info', r || '—'];
  return `<span class="res ${esc(r)}">${ic(m[0], 'sm')}${m[1]}</span>`;
}
const demoBadge = on => on ? '<span class="badge amber">' + ic('alert', 'sm') + 'สำหรับสาธิต</span>' : '';
function originBadge(o) {
  const s = String(o || '');
  if (/mock/.test(s)) return '<span class="badge gray" title="ข้อมูลจำลอง ไม่ใช่ข้อมูลจริง">' + ic('database', 'sm') + (s.indexOf('MUREX') === 0 ? 'MUREX ' : '') + 'จำลอง</span>';
  if (/import/.test(s)) return '<span class="badge blue" title="ข้อมูลที่ผู้ดูแลนำเข้าจากไฟล์">' + ic('upload', 'sm') + (s.indexOf('MUREX') === 0 ? 'MUREX ' : '') + 'นำเข้า</span>';

}
function workStatusBadge(st) {

  const m = map[st] || ['gray', 'info', st];
  return `<span class="badge ${m[0]}">${ic(m[1], 'sm')}${m[2]}</span>`;
}
function identityBadge(st) {
  const ok = st === 'code_match' || st === 'staff_confirmed';
  return `<span class="badge ${ok ? 'green' : 'amber'}">${ic(ok ? 'ok' : 'q', 'sm')}${esc(M().identity[st || ''] || st)}</span>`;
}
const empty = (msg, icon) => `<div class="empty">${ic(icon || 'list')}<div>${esc(msg)}</div></div>`;

const options = (map, sel, blank) => (blank !== undefined ? opt('', blank, sel) : '') + Object.keys(map).map(k => opt(k, map[k], sel)).join('');

/* ---------------- Modal ---------------- */
function modal(o) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><div class="modal ${o.wide ? 'wide' : ''}">
    <div class="modal-h"><h3>${esc(o.title)}</h3><button class="btn ghost sm icon" data-close aria-label="ปิด">${ic('x')}</button></div>
    <div class="modal-b">${o.body}</div>
    <div class="modal-f">${o.foot || ''}<button class="btn" data-close>${o.cancelLabel || 'ยกเลิก'}</button>${o.okLabel ? `<button class="btn ${o.okClass || 'primary'}" data-ok>${o.okLabel}</button>` : ''}</div>
  </div></div>`;
  const bg = $('.modal-bg', root);
  $$('[data-close]', root).forEach(b => b.onclick = closeModal);
  bg.addEventListener('mousedown', e => { if (e.target === bg) closeModal(); });
  const okBtn = $('[data-ok]', root);
  if (okBtn && o.onOk) okBtn.onclick = () => run(async () => { okBtn.disabled = true; try { const r = await o.onOk(bg); if (r !== false) closeModal(); } finally { okBtn.disabled = false; } });
  if (o.onMount) o.onMount(bg);
  const first = $('input,select,textarea', bg); if (first) first.focus();
  return bg;
}
function closeModal() { $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
const val = (sel, el) => { const x = $(sel, el); return x ? (x.type === 'checkbox' ? x.checked : x.value.trim()) : ''; };

function askReason(title, label, okLabel, onOk, extra) {
  modal({ title, okLabel, body: (extra || '') + field(label, '<textarea class="input" id="m-reason" rows="3"></textarea>'), onOk: bg => onOk(val('#m-reason', bg), bg) });
}

/* ---------------- ไฟล์ ---------------- */
function readFile(file) {
  return new Promise((resolve, reject) => {
    const max = M().maxFileMb * 1024 * 1024;
    const ext = (file.name.match(/\.([a-z0-9]+)$/i) || [])[1];
    if (!ext || M().allowedExt.indexOf(ext.toLowerCase()) === -1) return reject(new Error('ชนิดไฟล์ไม่อนุญาต — รับเฉพาะ ' + M().allowedExt.join(', ')));
    if (file.size > max) return reject(new Error('ไฟล์ใหญ่เกิน ' + M().maxFileMb + ' MB'));
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
    fr.onerror = () => reject(new Error('อ่านไฟล์ไม่ได้'));
    fr.readAsDataURL(file);
  });
}
function pickFile(accept) {
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept;
    inp.onchange = () => resolve(inp.files[0] || null);
    inp.click();
  });
}
async function openFile(id) {
  const f = await call('downloadFile', { fileId: id });
  const bin = atob(f.data); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: f.mime }));
  const a = document.createElement('a'); a.href = url; a.download = f.fileName; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

  const u = U();
  $('#nav').innerHTML = NAV[u.role].map(n => n[0] === 'g' ? `<div class="nav-group">${esc(n[2])}</div>` :

  $$('#nav a[data-nav]').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.nav); closeSide(); });
  $('#brand-sub').textContent = B().org || '';

  $('#user-chip').innerHTML = `<span class="avatar">${esc(initial(u.name))}</span><span class="who"><b>${esc(u.name)}</b><small>${esc(M().roles[u.role].label)}${u.isTest ? ' · บัญชีทดสอบ' : ''}</small></span>`;

function renderUserMenu() {
  const u = U();
  const roles = u.roles.map(r => `<button data-role="${r}">${ic(r === u.role ? 'check' : 'user')} ${esc(M().roles[r].label)}</button>`).join('');
  $('#user-menu').innerHTML = `<div class="dm-head"><b>${esc(u.name)}</b><div class="small muted">${esc(u.isTest ? 'บัญชีทดสอบ' : u.email)}<br>หน่วยงาน: ${esc(u.allUnits ? 'ทุกหน่วยงาน' : u.units.map(unitName).join(', '))}</div></div>
    ${u.roles.length > 1 ? '<div class="dm-label">สลับบทบาท</div>' + roles : ''}
    ${B().testMode ? `<button data-switch>${ic('swap')} เปลี่ยนบัญชีทดสอบ</button>` : ''}
    ${ss.get('rv-as') && B().signedInEmail ? `<button data-self>${ic('user')} กลับเป็นบัญชีของฉัน</button>` : ''}
    <button data-logout>${ic('logout')} ออกจากระบบ Google</button>`;
  $$('#user-menu [data-role]').forEach(b => b.onclick = () => { ss.set('rv-role', b.dataset.role); reboot('dashboard'); });
  const sw = $('#user-menu [data-switch]'); if (sw) sw.onclick = () => { ss.set('rv-as', null); ss.set('rv-role', null); S.forcePicker = true; reboot(); };
  const self = $('#user-menu [data-self]'); if (self) self.onclick = () => { ss.set('rv-as', null); ss.set('rv-role', null); reboot('dashboard'); };
  $('#user-menu [data-logout]').onclick = () => { ss.set('rv-as', null); ss.set('rv-role', null); window.open('https://accounts.google.com/Logout', '_top'); };
}

function setTitle(t) { $('#page-title').textContent = t; document.title = t + ' — ' + 'ระบบตรวจสอบผลงานและคุณสมบัติ'; }
function go(page, params) {
  S.page = page; S.params = params || {};
  try { history.replaceState(null, '', '#' + page + (S.params.id ? '/' + S.params.id : '')); } catch (e) { /* GAS iframe */ }
  render();
}
function closeSide() { $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('open'); }
const view = html => { $('#content').innerHTML = html; $('#content').scrollTop = 0; window.scrollTo(0, 0); };

async function render() {
  renderShell();
  const pg = PAGES[S.page] || PAGES.dashboard;
  view('<div class="loading"><div><div class="spinner"></div>กำลังโหลด…</div></div>');
  try { await pg(); } catch (e) { if (!e.shown) toast(e.message, 'err'); view(`<div class="banner red">${ic('alert')}<div><b>โหลดหน้านี้ไม่ได้</b><div class="sub pre">${esc(e.message)}</div></div></div>`); }
}

async function reboot(page) {
  const prev = S.boot && S.boot.user ? S.boot.user.id + '/' + S.boot.user.role : '';
  S.boot = await call('boot');
  if (!S.boot.user || prev !== S.boot.user.id + '/' + S.boot.user.role) { S.cache = {}; S.tab = {}; }
  window.__rvLoaded = true;
  if (!S.boot.user || S.forcePicker) { S.forcePicker = false; return renderPicker(); }
  if (ss.get('rv-role') && U().role !== ss.get('rv-role')) ss.set('rv-role', U().role);
  go(page || S.page || 'dashboard', page ? {} : S.params);
}

function requestTable(list, opts) {
  if (!list.length) return empty('ไม่มีคำขอ', 'inbox');
  return `<div class="table-wrap"><table class="t"><thead><tr><th>เลขที่/เรื่อง</th><th>บุคคลที่ตรวจ</th><th>สถานะ</th><th>ผู้รับผิดชอบตอนนี้</th><th class="num">รอมาแล้ว</th>${opts && opts.unit ? '<th>หน่วยงาน</th>' : ''}</tr></thead><tbody>
    ${list.map(r => `<tr class="click" data-open="${esc(r.id)}" tabindex="0"><td><div class="title">${esc(r.code)} ${demoBadge(r.isDemo)}</div><div class="sub">${esc(r.typeName)}${r.round > 1 ? ' · รอบที่ ' + r.round : ''}</div></td>
      <td>${esc(r.personName || '—')}<div class="sub">ผู้ยื่น: ${esc(r.requesterName)}</div></td>
      <td>${statusBadge(r.status)}<div class="sub">${esc(r.nextStep || '')}</div></td>
      <td>${esc(r.holderName || '—')}</td><td class="num">${r.status === 'closed' || r.status === 'cancelled' ? '—' : r.waitingDays + ' วัน'}</td>
      ${opts && opts.unit ? `<td>${esc(unitName(r.unit))}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
}

function bindCommon() {
  $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $$('[data-open]').forEach(b => { b.onclick = () => go('request', { id: b.dataset.open }); b.onkeydown = e => { if (e.key === 'Enter') b.onclick(); }; });
}

/* ---------------- รายละเอียดคำขอ ---------------- */
const SECTION_TAB = { info: 'info', person: 'person', works: 'works', documents: 'docs' };

PAGES.request = async () => {
  const id = S.params.id;
  const d = await call('getRequest', { id });
  S.cache.req = d;
  const R = d.request, A = d.actions;
  setTitle(R.code);
  const owner = A.indexOf('edit') > -1;
  const tabs = [['info', 'ข้อมูลคำขอ'], ['person', 'บุคคลที่ตรวจ'], ['works', 'ผลงาน'], ['docs', 'เอกสารแนบ']];
  if (owner) tabs.push(['check', 'ตรวจความครบถ้วนและยื่น']);
  if (d.evaluations.length || !owner) tabs.push(['results', 'ผลตรวจตามเกณฑ์']);
  tabs.push(['history', 'ประวัติ']);
  let tab = S.tab[id] || (A.indexOf('decide') > -1 ? 'results' : owner && R.status === 'returned' ? 'info' : owner ? 'person' : A.indexOf('verify') > -1 ? 'works' : 'results');
  if (!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  const issues = d.completeness ? d.completeness.issues : [];
  const stepCls = k => {
    if (!owner) return '';
    const sec = Object.keys(SECTION_TAB).find(s => SECTION_TAB[s] === k);
    if (!sec) return '';
    if (d.editable.indexOf(sec) === -1) return 'lockd';
    return issues.some(i => i.section === sec && i.blocking) ? 'warn' : 'done';
  };
  const st = M().statuses[R.status];
  view(`<div class="stack">
    <div><button class="btn ghost sm" data-go="requests">${ic('back', 'sm')} กลับไปรายการ</button></div>
    <div class="card"><div class="card-b">
      <div class="req-head"><div class="t"><div class="row">${statusBadge(R.status)} ${demoBadge(R.isDemo)} ${R.round > 1 ? `<span class="badge gray">รอบที่ ${esc(R.round)}</span>` : ''}</div>
        <h2>${esc(R.code)} · ${esc(R.title)}</h2>
        <div class="small muted">${esc(d.type ? d.type.name : '')} · ${esc(unitName(R.unit))} · ผู้ยื่น ${esc(d.summary.requesterName)} · สร้าง ${thaiDate(R.createdAt)}${R.submittedAt ? ' · ยื่น ' + thaiDate(R.submittedAt) : ''}</div></div>
        <div class="row">${actionButtons(d)}</div></div>
      <div class="nextbox">${ic('info')}<div><b>ขณะนี้อยู่ที่: ${esc(d.summary.holderName || '—')}</b><span class="small">ขั้นต่อไป: ${esc(st.next)}</span></div></div>
      ${R.isDemo ? `<div class="banner amber mt-s">${ic('alert')}<div><b>คำขอสาธิต</b><div class="sub">ใช้เกณฑ์สำหรับสาธิต ผลตรวจและผลพิจารณาไม่มีผลจริง ห้ามนำไปใช้ตัดสินคำขอจริง</div></div></div>` : ''}
      ${R.status === 'returned' ? revisionBanner(d) : ''}
    </div>
    <div class="steps" role="tablist">${tabs.map((t, i) => `<button role="tab" aria-selected="${t[0] === tab}" class="${t[0] === tab ? 'on' : ''} ${stepCls(t[0])}" data-tab="${t[0]}"><span class="no">${stepCls(t[0]) === 'done' ? ic('check', 'sm') : stepCls(t[0]) === 'lockd' ? ic('lock', 'sm') : i + 1}</span>${t[1]}</button>`).join('')}</div>
    <div class="card-b" id="tab-body">${TABS[tab](d)}</div>
    ${owner && ['info', 'person', 'works', 'docs'].indexOf(tab) > -1 ? `<div class="card-b row between" style="border-top:1px solid var(--border)"><span class="small muted">${ic('save', 'sm')} ข้อมูลบันทึกเป็นร่างทันทีที่กดบันทึกในแต่ละส่วน</span>
      <button class="btn primary" data-tab="${tabs[tabs.findIndex(t => t[0] === tab) + 1][0]}">ขั้นถัดไป ${ic('back', 'sm').replace('<svg', '<svg style="transform:rotate(180deg)"')}</button></div>` : ''}
    </div></div>`);
  bindCommon();
  $$('[data-tab]').forEach(b => b.onclick = () => { S.tab[id] = b.dataset.tab; render(); });
  bindActions(d);
  (BIND[tab] || (() => {}))(d);
};

function actionButtons(d) {
  const A = d.actions, b = [];
  if (A.indexOf('submit') > -1) b.push(`<button class="btn primary" data-act="gotoSubmit">${ic('send')} ${d.request.status === 'returned' ? 'ยื่นใหม่' : 'ยื่นคำขอ'}</button>`);
  if (A.indexOf('claim') > -1) b.push(`<button class="btn primary" data-act="claim">${ic('inbox')} รับเรื่องตรวจ</button>`);
  if (A.indexOf('assign') > -1) b.push(`<button class="btn" data-act="assign">${ic('users')} มอบหมาย</button>`);
  if (A.indexOf('return') > -1) b.push(`<button class="btn" data-act="return">${ic('undo')} ส่งกลับแก้ไข</button>`);
  if (A.indexOf('forward') > -1) b.push(`<button class="btn primary" data-act="forward">${ic('send')} ส่งต่อผู้พิจารณา</button>`);
  if (A.indexOf('close') > -1) b.push(`<button class="btn success" data-act="close">${ic('ok')} แจ้งผลและปิดงาน</button>`);
  if (A.indexOf('decide') > -1) b.push(`<button class="btn primary" data-act="gotoDecide">${ic('gavel')} บันทึกผลพิจารณา</button>`);
  if (A.indexOf('cancel') > -1) b.push(`<button class="btn ghost-danger" data-act="cancel">${ic('x')} ยกเลิกคำขอ</button>`);
  return b.join('');
}

        field('ผู้พิจารณา', `<select class="select" id="m-rev">${(d.reviewerOptions || []).map(u => opt(u.id, u.name)).join('') || opt('', 'ไม่มีผู้พิจารณาในหน่วยงานนี้')}</select>`) +

      onOk: async bg => { await call('forward', { id: R.id, reviewerId: val('#m-rev', bg), summary: val('#m-sum', bg) }); toast('ส่งต่อแล้ว', 'ok'); reload(); } }),
    close: () => modal({ title: 'แจ้งผลและปิดงาน', okLabel: 'แจ้งผลและปิดงาน', okClass: 'success',
      body: `<p>ผลพิจารณาล่าสุด: <b>${esc((d.decisions.slice(-1)[0] || {}).decision ? M().decisions[d.decisions.slice(-1)[0].decision] : '—')}</b></p><p class="small muted">ระบบจะแจ้งผู้ยื่นภายในระบบ (ไม่ส่งอีเมล)</p>` + field('ข้อความถึงผู้ยื่น (ไม่บังคับ)', '<textarea class="input" id="m-note" rows="2"></textarea>'),
      onOk: async bg => { await call('close', { id: R.id, note: val('#m-note', bg) }); toast('ปิดงานแล้ว', 'ok'); reload(); } }),
    cancel: () => askReason('ยกเลิกคำขอ', 'เหตุผลการยกเลิก (ข้อมูลและประวัติยังเก็บไว้)', 'ยืนยันยกเลิก', async r => { await call('cancel', { id: R.id, reason: r }); toast('ยกเลิกแล้ว', 'ok'); reload(); })
  };
  $$('[data-act]').forEach(b => b.onclick = () => act[b.dataset.act]());

}

    const code = val('#p-code'), name = val('#p-name');

    try { res = await call('searchPersons', { staffCode: code, name: code ? '' : name }, true); }
    catch (e) {
      box.innerHTML = `<div class="banner ${e.sourceError ? 'amber' : 'red'}">${ic('alert')}<div><b>${e.sourceError ? 'ค้นจากระบบต้นทางไม่ได้' : 'ค้นหาไม่สำเร็จ'}</b><div class="sub pre">${esc(e.message)}</div>
        ${e.sourceError ? '<div class="sub">ทำต่อได้โดย "กรอกข้อมูลเอง" ด้านล่าง เจ้าหน้าที่จะยืนยันภายหลัง — การค้นไม่ได้ไม่ถือว่าไม่ผ่าน</div>' : ''}</div></div>`;
      return;
    }
    if (!res.results.length) { box.innerHTML = `<div class="banner amber">${ic('q')}<div><b>ไม่พบในข้อมูล MUHR (${esc(res.source.modeLabel)})</b><div class="sub">ตรวจการสะกด ลองชื่ออังกฤษ/ชื่อเดิม หรือกรอกข้อมูลเองด้านล่าง — การค้นไม่พบไม่ได้แปลว่าไม่มีตัวตนหรือไม่ผ่าน</div></div></div>`; return; }
    const basisLabel = { staffCode: 'ตรงกับรหัสบุคลากร', name: 'ชื่อตรงกัน', name_partial: 'ชื่อตรงบางส่วน', former_name: 'ตรงกับชื่อเดิม', former_name_partial: 'ตรงกับชื่อเดิมบางส่วน' };
    box.innerHTML = `${res.ambiguous ? `<div class="banner amber mb">${ic('users')}<div><b>พบหลายคนที่ชื่อคล้ายหรือตรงกัน</b><div class="sub">โปรดตรวจรหัสบุคลากร/สังกัดให้ตรงคน หากไม่แน่ใจให้ค้นด้วยรหัสบุคลากร — บุคคลที่เลือกจากชื่อจะต้องให้เจ้าหน้าที่ยืนยัน</div></div></div>` : ''}
      <div class="table-wrap"><table class="t"><thead><tr><th>ชื่อ</th><th>รหัส</th><th>สังกัด</th><th>ข้อมูล</th><th>ตรงเพราะ</th><th></th></tr></thead><tbody>
      ${res.results.map(p => `<tr><td><b>${esc(p.nameTh)}</b><span class="sub">${esc(p.nameEn)}${p.formerNames ? ' · ชื่อเดิม ' + esc(p.formerNames) : ''}</span></td><td>${esc(p.staffCode)}</td><td>${esc(unitName(p.unit))}<span class="sub">${esc(M().ranks[p.academicRank] || '')}</span></td>
        <td>${originBadge(p.origin)}<span class="sub">ดึงเมื่อ ${thaiDate(p.fetchedAt)}${p.staleness.stale ? ' · <b>ข้อมูลเก่า</b>' : ''}</span></td>
        <td>${p.matchBasis === 'staffCode' ? '<span class="badge green">' + ic('ok', 'sm') : '<span class="badge amber">' + ic('q', 'sm')}${esc(basisLabel[p.matchBasis] || p.matchBasis)}</span>${p.duplicateName ? '<span class="sub">ชื่อซ้ำ ' + p.sameNameCount + ' คน</span>' : ''}</td>
        <td><button class="btn sm primary" data-pick="${esc(p.personId)}">เลือก</button></td></tr>`).join('')}</tbody></table></div>
      <div class="small muted mt-s">แหล่งข้อมูล: ${esc(res.source.modeLabel)} · ${esc(res.source.message)}</div>`;
    $$('[data-pick]', box).forEach(b => b.onclick = () => run(async () => {
      const r = await call('setPerson', { id: R.id, personId: b.dataset.pick, staffCode: code, name });
      toast('เลือกบุคคลแล้ว: ' + r.identityLabel, 'ok'); reload();
    }));
  });
  sb.onclick = doSearch;
  ['#p-code', '#p-name'].forEach(s => $(s).onkeydown = e => { if (e.key === 'Enter') doSearch(); });
  $('#m-save').onclick = () => run(async () => {
    await call('setPerson', { id: R.id, manual: { titleTh: val('#m-title'), nameTh: val('#m-th'), nameEn: val('#m-en'), formerNames: val('#m-former'), affiliation: val('#m-aff'), position: val('#m-pos'), academicRank: val('#m-rank'), highestDegree: val('#m-deg'), reason: val('#m-reason') } });
    toast('บันทึกข้อมูลบุคคลแล้ว (รอเจ้าหน้าที่ยืนยัน)', 'ok'); reload();
  });
};

/* --- ผลงาน --- */
TABS.works = d => {
  const ed = canEdit(d, 'works'), staff = d.actions.indexOf('verify') > -1;
  const R = d.request;
  const active = d.works.filter(w => w.status !== 'withdrawn');
  const gone = d.works.filter(w => w.status === 'withdrawn');
  const wById = id => d.works.find(w => w.id === id) || {};
  const openPairs = d.dupPairs.filter(p => p.status === 'suspected' && ['withdrawn', 'excluded_duplicate'].indexOf(wById(p.workA).status) === -1 && ['withdrawn', 'excluded_duplicate'].indexOf(wById(p.workB).status) === -1);
  const basis = { doi: 'DOI เดียวกัน', title_year: 'ชื่อเรื่องและปีตรงกัน', title_similar: 'ชื่อเรื่องคล้ายกันมาก' };
  const wBrief = w => `<b>${esc(w.title)}</b><div class="small muted">${esc(M().workTypes[w.type] || '')} · ${esc(w.year)} · ${esc(w.venue || '')}</div><div class="small">${w.doi ? 'DOI ' + esc(w.doi) : esc(w.ref || 'ไม่มี DOI/รหัสอ้างอิง')}</div><div>${originBadge(w.origin)}</div>`;
  return `<div class="stack">
    ${!ed && d.actions.indexOf('edit') > -1 ? lockNote('works') : ''}
    ${ed ? `<div class="row"><button class="btn primary" id="w-src">${ic('database')} ดึงผลงานจาก MUREX</button><button class="btn" id="w-add">${ic('plus')} เพิ่มผลงานเอง</button>${sourceTag('MUREX')}</div>
      <div class="small muted">ผลงานจาก MUREX เลือกยืนยันรายการได้เลย ผลงานที่กรอกเองต้องมี DOI/เลขอ้างอิง หรือแนบหลักฐาน · ระบบตรวจรายการซ้ำ (DOI ก่อน แล้วชื่อเรื่อง+ปี) แต่ไม่รวมรายการให้เอง</div>` : ''}
    ${openPairs.length ? `<div><h3 style="margin:0 0 8px">${ic('layers')} ผลงานที่สงสัยว่าซ้ำ (${openPairs.length} คู่) — ${staff ? 'โปรดตัดสิน' : 'รอเจ้าหน้าที่ตัดสิน'}</h3>
      ${openPairs.map(p => `<div class="dup"><b>${esc(basis[p.basis] || p.basis)}</b> <span class="small">(ความคล้าย ${Math.round(Number(p.score) * 100)}%)</span>
        <div class="pair"><div>${wBrief(wById(p.workA))}</div><div>${wBrief(wById(p.workB))}</div></div>
        ${staff ? `<div class="row"><button class="btn sm" data-dup="${esc(p.id)}" data-keep="${esc(p.workA)}">ซ้ำ — เก็บรายการซ้าย</button><button class="btn sm" data-dup="${esc(p.id)}" data-keep="${esc(p.workB)}">ซ้ำ — เก็บรายการขวา</button><button class="btn sm" data-dup="${esc(p.id)}" data-distinct="1">ไม่ซ้ำ</button></div>` : ''}</div>`).join('')}</div>` : ''}
    ${staff ? `<div class="banner ${R.worksComplete ? 'green' : 'blue'}">${ic(R.worksComplete ? 'ok' : 'info')}<div style="flex:1"><b>${R.worksComplete ? 'ยืนยันแล้วว่ารายการผลงานครบถ้วน' : 'ยังไม่ได้ยืนยันว่ารายการผลงานครบถ้วน'}</b>
      <div class="sub">${R.worksComplete ? esc(R.worksCompleteNote) : 'ถ้าจำนวนผลงานไม่ถึงเกณฑ์ ระบบจะสรุปว่า "ไม่ผ่าน" ได้ก็ต่อเมื่อเจ้าหน้าที่ยืนยันว่ารายการครบถ้วนแล้วเท่านั้น มิฉะนั้นจะเป็น "ยังสรุปไม่ได้"'}</div>
      <button class="btn sm mt-s" id="w-complete">${R.worksComplete ? 'ยกเลิกการยืนยัน' : 'ยืนยันว่ารายการครบถ้วน'}</button></div></div>` : ''}
    ${active.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>#</th><th>ผลงาน</th><th>ปี</th><th>แหล่งเผยแพร่</th><th>DOI/รหัสอ้างอิง</th><th>ที่มา</th><th>สถานะ</th><th></th></tr></thead><tbody>
      ${active.map((w, i) => `<tr><td>${i + 1}</td><td><div class="title">${esc(w.title)}</div><span class="sub">${esc(M().workTypes[w.type] || w.type)}${w.authors ? ' · ' + esc(w.authors) : ''}</span>
          ${w.evidence.length ? `<span class="sub">${w.evidence.map(f => `<a href="#" data-file="${esc(f.id)}">${ic('file', 'sm')} ${esc(f.fileName)}</a>`).join(' ')}</span>` : ''}
          ${w.staffNote ? `<span class="sub">หมายเหตุ: ${esc(w.staffNote)}</span>` : ''}</td>
        <td>${esc(w.year)}${Number(w.year) ? '<span class="sub">พ.ศ. ' + (Number(w.year) + 543) + '</span>' : ''}</td><td>${esc(w.venue || '—')}</td>
        <td>${w.doi ? doiLink(w.doi) : esc(w.ref || '—')}</td><td>${originBadge(w.origin)}</td><td>${workStatusBadge(w.status)}</td>
        <td><div class="actions">
          ${staff && ['pending', 'verified', 'rejected'].indexOf(w.status) > -1 ? `${w.status !== 'verified' ? `<button class="btn sm" data-verify="${esc(w.id)}" title="ยืนยันผลงาน">${ic('check', 'sm')} ยืนยัน</button>` : ''}${w.status !== 'rejected' ? `<button class="btn sm ghost-danger" data-reject="${esc(w.id)}">ไม่รับ</button>` : ''}` : ''}
          ${ed && w.origin === 'manual' ? `<button class="btn sm icon" data-wedit="${esc(w.id)}" aria-label="แก้ไข">${ic('edit', 'sm')}</button>` : ''}
          ${ed && w.origin === 'manual' && !w.doi && !w.ref ? `<button class="btn sm" data-evi="${esc(w.id)}">${ic('upload', 'sm')} หลักฐาน</button>` : ''}
          ${ed ? `<button class="btn sm icon ghost-danger" data-wdel="${esc(w.id)}" aria-label="ถอนออก">${ic('trash', 'sm')}</button>` : ''}</div></td></tr>`).join('')}</tbody></table></div>` : empty('ยังไม่มีผลงาน', 'file')}
    ${gone.length ? `<details class="faq"><summary>ผลงานที่ถอนออกแล้ว (${gone.length}) — เก็บไว้เป็นประวัติ</summary><div class="a">${gone.map(w => `<div>${esc(w.title)} <span class="small muted">${esc(w.staffNote || '')}</span></div>`).join('')}</div></details>` : ''}
  </div>`;
};
function workForm(w) {
  w = w || {};
  return `<div class="form-grid">${field('ชื่อผลงาน', `<input class="input" id="w-title" value="${esc(w.title)}">`, '', 'full')}
    ${field('ประเภท', `<select class="select" id="w-type">${options(M().workTypes, w.type, '— เลือก —')}</select>`)}${field('ปีที่เผยแพร่', `<input class="input" id="w-year" value="${esc(w.year)}" inputmode="numeric">`, 'กรอก ค.ศ. หรือ พ.ศ. ก็ได้')}
    ${field('วารสาร/แหล่งเผยแพร่', `<input class="input" id="w-venue" value="${esc(w.venue)}">`)}${field('วันที่เผยแพร่ (ถ้ามี)', `<input class="input" id="w-date" type="date" value="${esc(w.pubDate)}">`)}
    ${field('ผู้แต่ง', `<input class="input" id="w-authors" value="${esc(w.authors)}" placeholder="คั่นด้วย ,">`, '', 'full')}
    ${field('DOI', `<input class="input" id="w-doi" value="${esc(w.doi)}" placeholder="10.xxxx/xxxx">`)}${field('รหัสอ้างอิงอื่น', `<input class="input" id="w-ref" value="${esc(w.ref)}" placeholder="เช่น ISBN, เลขสิทธิบัตร">`)}</div>
    <div class="small muted mt-s">ถ้าไม่มีทั้ง DOI และรหัสอ้างอิง ต้องแนบไฟล์หลักฐานของผลงานก่อนยื่น</div>`;
}
const workVals = bg => ({ title: val('#w-title', bg), type: val('#w-type', bg), year: val('#w-year', bg), venue: val('#w-venue', bg), pubDate: val('#w-date', bg), authors: val('#w-authors', bg), doi: val('#w-doi', bg), ref: val('#w-ref', bg) });
BIND.works = d => {
  const R = d.request;
  const src = $('#w-src');
  if (src) src.onclick = () => run(async () => {
    let res;
    try { res = await call('sourceWorks', { id: R.id }, true); }
    catch (e) { return modal({ title: 'ดึงผลงานจาก MUREX', body: `<div class="banner amber">${ic('alert')}<div><b>ดึงจากระบบต้นทางไม่ได้</b><div class="sub pre">${esc(e.message)}</div><div class="sub">เพิ่มผลงานเองได้ — การดึงไม่ได้ไม่ถือว่าไม่มีผลงาน</div></div></div>`, cancelLabel: 'ปิด' }); }
    const list = res.works;
    modal({ title: 'ผลงานจาก MUREX', wide: true, okLabel: list.some(w => !w.added) ? 'เพิ่มรายการที่เลือก' : '',
      body: `<div class="small muted mb">${esc(res.source.modeLabel)} · ${esc(res.source.message)}${res.note ? '<br>' + esc(res.note) : ''}</div>
        ${list.length ? list.map(w => `<label class="check" style="display:flex;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)"><input type="checkbox" value="${esc(w.id)}" ${w.added ? 'disabled checked' : 'checked'}>
          <span><b>${esc(w.title)}</b><br><span class="small muted">${esc(M().workTypes[w.type] || w.type)} · ${esc(w.year)} · ${esc(w.venue)} · ${w.doi ? 'DOI ' + esc(w.doi) : esc(w.workRef)}</span> ${originBadge(w.origin)} ${w.added ? '<span class="badge green">เพิ่มแล้ว</span>' : ''}</span></label>`).join('') : empty('ไม่พบผลงานของบุคคลนี้ใน MUREX — เพิ่มเองได้')}`,
      onOk: async bg => { const ids = $$('input[type=checkbox]:not(:disabled):checked', bg).map(x => x.value); if (!ids.length) return false; const r = await call('addSourceWorks', { id: R.id, workIds: ids }); toast('เพิ่ม ' + r.added + ' รายการ' + (r.suspectedDuplicates ? ' · พบรายการสงสัยว่าซ้ำ ' + r.suspectedDuplicates + ' คู่' : ''), 'ok'); reload(); } });
  });
  const add = $('#w-add');
  if (add) add.onclick = () => modal({ title: 'เพิ่มผลงาน', wide: true, okLabel: 'บันทึก', body: workForm(), onOk: async bg => { const r = await call('saveManualWork', { id: R.id, work: workVals(bg) }); toast('บันทึกแล้ว' + (r.suspectedDuplicates ? ' · สงสัยว่าซ้ำกับรายการเดิม — เจ้าหน้าที่จะตรวจ' : ''), 'ok'); reload(); } });
  $$('[data-wedit]').forEach(b => b.onclick = () => { const w = d.works.find(x => x.id === b.dataset.wedit); modal({ title: 'แก้ไขผลงาน', wide: true, okLabel: 'บันทึก', body: workForm(w), onOk: async bg => { await call('saveManualWork', { id: R.id, workId: w.id, work: workVals(bg) }); toast('บันทึกแล้ว', 'ok'); reload(); } }); });
  $$('[data-wdel]').forEach(b => b.onclick = () => askReason('ถอนผลงานออกจากคำขอ', 'เหตุผล (รายการยังเก็บเป็นประวัติ)', 'ถอนออก', async r => { await call('withdrawWork', { id: R.id, workId: b.dataset.wdel, reason: r }); reload(); }));
  $$('[data-evi]').forEach(b => b.onclick = () => run(async () => { const f = await pickFile('.' + M().allowedExt.join(',.')); if (!f) return; const data = await readFile(f); await call('uploadFile', { id: R.id, workId: b.dataset.evi, fileName: f.name, data }); toast('แนบหลักฐานแล้ว', 'ok'); reload(); }));
  $$('[data-file]').forEach(a => a.onclick = e => { e.preventDefault(); run(() => openFile(a.dataset.file)); });
  $$('[data-verify]').forEach(b => b.onclick = () => run(async () => { await call('verifyWork', { workId: b.dataset.verify, status: 'verified', note: '' }); reload(); }));
  $$('[data-reject]').forEach(b => b.onclick = () => askReason('ไม่รับผลงานนี้', 'เหตุผล (ผู้ยื่นและผู้พิจารณาจะเห็น)', 'บันทึก', async r => { await call('verifyWork', { workId: b.dataset.reject, status: 'rejected', note: r }); reload(); }));
  $$('[data-dup]').forEach(b => b.onclick = () => {
    if (b.dataset.distinct) askReason('ไม่ใช่รายการซ้ำ', 'เหตุผลที่ถือว่าเป็นคนละผลงาน', 'บันทึก', async r => { await call('resolveDup', { pairId: b.dataset.dup, decision: 'distinct', note: r }); reload(); });
    else run(async () => { await call('resolveDup', { pairId: b.dataset.dup, decision: 'duplicate', keepWorkId: b.dataset.keep, note: '' }); toast('คัดรายการซ้ำออกแล้ว (ไม่ได้ลบ)', 'ok'); reload(); });
  });
  const wc = $('#w-complete');
  if (wc) wc.onclick = () => R.worksComplete ? run(async () => { await call('setWorksComplete', { id: R.id, value: false }); reload(); })
    : askReason('ยืนยันว่ารายการผลงานครบถ้วน', 'ตรวจความครบถ้วนจากแหล่งใด (เช่น ตรวจกับ MUREX และ CV ฉบับล่าสุด)', 'ยืนยัน', async r => { await call('setWorksComplete', { id: R.id, value: true, note: r }); reload(); });
};

/* --- เอกสารแนบ --- */
TABS.docs = d => {
  const ed = canEdit(d, 'documents');
  const req = d.requiredDocs.filter(x => x.code !== 'evidence');
  const active = d.attachments.filter(a => a.status === 'active' && !a.workId);
  const removed = d.attachments.filter(a => a.status !== 'active');
  const docTypes = (d.type ? d.type.requiredDocs : []);
  return `<div class="stack">
    ${!ed && d.actions.indexOf('edit') > -1 ? lockNote('documents') : ''}
    <div class="card"><div class="card-h"><h3>${ic('list')} เอกสารที่ต้องใช้สำหรับคำขอนี้</h3></div><div class="card-b">
      ${req.length ? req.map(x => `<div class="row between" style="padding:8px 0;border-bottom:1px dashed var(--border)"><div>${x.attached ? `<span class="res pass">${ic('ok', 'sm')} แนบแล้ว</span>` : `<span class="res inconclusive">${ic('q', 'sm')} ยังไม่แนบ</span>`} <b>${esc(x.label)}</b>${x.hint ? `<div class="small muted">${esc(x.hint)}</div>` : ''}</div>
        ${ed ? `<button class="btn sm ${x.attached ? '' : 'primary'}" data-up="${esc(x.code)}">${ic('upload', 'sm')} ${x.attached ? 'แนบเพิ่ม' : 'แนบไฟล์'}</button>` : ''}</div>`).join('') : '<div class="muted">ประเภทคำขอนี้ไม่ต้องแนบเอกสารเพิ่มเติม</div>'}
      ${d.requiredDocs.some(x => x.code === 'evidence') ? `<div class="small muted mt-s">หลักฐานของผลงานที่ไม่มี DOI/รหัสอ้างอิง แนบได้ที่แท็บ "ผลงาน"</div>` : ''}
      ${ed && docTypes.length ? `<div class="small muted mt-s">ระบบขอเฉพาะเอกสารที่จำเป็นตามประเภทคำขอและข้อมูลที่กรอก · รับไฟล์ ${M().allowedExt.join(', ')} ไม่เกิน ${M().maxFileMb} MB</div>` : ''}
    </div></div>
    <div class="card"><div class="card-h"><h3>${ic('file')} ไฟล์ที่แนบ</h3><span class="spacer"></span><span class="small muted">${ic('lock', 'sm')} เปิดได้เฉพาะผู้มีสิทธิ์ในคำขอนี้</span></div><div class="card-b tight">
      ${active.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>ไฟล์</th><th>ชนิดเอกสาร</th><th>แนบโดย</th><th></th></tr></thead><tbody>${active.map(a => `<tr><td><a href="#" data-file="${esc(a.id)}">${ic('file', 'sm')} ${esc(a.fileName)}</a><span class="sub">${Math.ceil(a.size / 1024)} KB</span></td>

function evidenceRefs(ev, d) {
  return (ev || []).map(x => {
    const [k, id] = x.split(':');
    if (k === 'work') { const w = d.works.find(w => w.id === id); return w ? `<span class="sub">${ic('file', 'sm')} ${esc(w.title)}</span>` : ''; }
    if (k === 'file') { const a = d.attachments.find(a => a.id === id); return a ? `<span class="sub"><a href="#" data-file="${esc(a.id)}">${ic('file', 'sm')} ${esc(a.fileName)}</a></span>` : ''; }
    return '';
  }).join('');
}

function ruleRow(r) {
  r = r || { kind: 'identity_verified', params: {} };
  const kinds = M().ruleKinds;
  const p = r.params || {};
  const multi = (name, dict, sel) => `<div class="chips">${Object.keys(dict).map(k => `<label class="chip-check"><input type="checkbox" data-p="${name}" value="${k}" ${(sel || []).indexOf(k) > -1 ? 'checked' : ''}> ${esc(dict[k])}</label>`).join('')}</div>`;
  const pf = {
    person_status: field('สถานะที่ยอมรับ', multi('allowed', M().empStatus, p.allowed)),
    min_degree: field('คุณวุฒิที่ยอมรับ', multi('allowed', M().degrees, p.allowed)),
    academic_rank: field('ตำแหน่งที่ยอมรับ', multi('allowed', M().ranks, p.allowed)),
    min_works: `<div class="form-grid">${field('จำนวนขั้นต่ำ', `<input class="input" data-p="min" type="number" min="1" value="${esc(p.min || '')}">`)}${field('ย้อนหลังกี่ปี (0 = ไม่จำกัด)', `<input class="input" data-p="years" type="number" min="0" value="${esc(p.years || 0)}">`, 'นับรวมปีปัจจุบัน')}</div>` + field('ประเภทผลงานที่นับ (ไม่เลือก = ทุกประเภท)', multi('types', M().workTypes, p.types)),
    required_documents: field('รหัสเอกสารที่ต้องมี (คั่นด้วย ,)', `<input class="input" data-p="docs" value="${esc((p.docs || []).join(','))}">`, 'ตรงกับรหัสเอกสารในประเภทคำขอ เช่น cv'),
    manual: field('คำแนะนำให้เจ้าหน้าที่', `<input class="input" data-p="instruction" value="${esc(p.instruction || '')}">`),
    identity_verified: ''
  };
  return `<div class="rule-row"><div class="inline-form"><div class="field" style="max-width:90px"><label>รหัสข้อ</label><input class="input" data-k="id" value="${esc(r.id || '')}"></div>
    <div class="field" style="max-width:230px"><label>ชนิดการตรวจ</label><select class="select" data-k="kind">${Object.keys(kinds).map(k => opt(k, kinds[k].label, r.kind)).join('')}</select></div>
    <div class="field" style="flex:3"><label>ข้อความเกณฑ์ (ตามประกาศ)</label><input class="input" data-k="label" value="${esc(r.label || '')}"></div>
    <button class="btn sm icon ghost-danger" data-rdel aria-label="ลบข้อนี้">${ic('trash', 'sm')}</button></div><div class="mt-s" data-params>${pf[r.kind] || ''}</div></div>`;
}
function readRules(bg) {
  return $$('.rule-row', bg).map(row => {
    const r = { id: $('[data-k=id]', row).value.trim(), kind: $('[data-k=kind]', row).value, label: $('[data-k=label]', row).value.trim(), params: {} };
    $$('[data-p]', row).forEach(x => {
      const k = x.dataset.p;
      if (x.type === 'checkbox') { r.params[k] = r.params[k] || []; if (x.checked) r.params[k].push(x.value); }
      else if (k === 'docs') r.params.docs = x.value.split(',').map(s => s.trim()).filter(String);
      else r.params[k] = x.value;
    });
    return r;
  });
}
function criteriaModal(a, cur, from) {
  const base = cur || from || {};
  modal({ title: cur ? 'แก้ไขร่าง ' + cur.code + ' v' + cur.version : from ? 'สร้างเวอร์ชันใหม่ของ ' + from.code : 'สร้างชุดเกณฑ์ใหม่', wide: true, okLabel: 'บันทึกเป็นร่าง',
    body: `<div class="form-grid">
      ${field('ประเภทคำขอ', `<select class="select" id="c-type" ${from || cur ? 'disabled' : ''}>${a.types.map(t => opt(t.id, t.name, base.typeId)).join('')}</select>`)}
      ${!cur && !from ? field('รหัสชุดเกณฑ์', '<input class="input" id="c-code" placeholder="เช่น CS-EXAMINER">') : field('รหัสชุดเกณฑ์', `<input class="input" disabled value="${esc(base.code)}">`)}
      ${field('ชื่อชุดเกณฑ์', `<input class="input" id="c-name" value="${esc(base.name || '')}">`, '', 'full')}
      ${field('แหล่งอ้างอิง (ประกาศ/ข้อบังคับ ข้อ)', `<input class="input" id="c-ref" value="${esc(base.referenceSource || '')}">`, 'จำเป็นสำหรับเกณฑ์จริง', 'full')}
      ${field('วันที่มีผล', `<input class="input" type="date" id="c-eff" value="${esc(String(base.effectiveDate || '').slice(0, 10))}">`)}
      <div class="field"><label>ประเภทเกณฑ์</label><label class="check"><input type="checkbox" id="c-demo" ${base.isDemo ? 'checked' : ''}> สำหรับสาธิต (ห้ามใช้ตัดสินจริง)</label></div>
      ${field('เงื่อนไข/คำอธิบายเพิ่มเติม', `<textarea class="input" id="c-cond" rows="2">${esc(base.conditionsText || '')}</textarea>`, '', 'full')}</div>
      <h3 style="margin:18px 0 8px">ข้อเกณฑ์</h3><div id="c-rules">${(base.rules || [null]).map(ruleRow).join('')}</div><button class="btn sm" id="c-add">${ic('plus', 'sm')} เพิ่มข้อ</button>`,
    onMount: bg => {
      const bindRows = () => {
        $$('[data-rdel]', bg).forEach(b => b.onclick = () => b.closest('.rule-row').remove());
        $$('[data-k=kind]', bg).forEach(s => s.onchange = () => { const row = s.closest('.rule-row'); row.outerHTML = ruleRow({ id: $('[data-k=id]', row).value, kind: s.value, label: $('[data-k=label]', row).value, params: {} }); bindRows(); });
      };
      $('#c-add', bg).onclick = () => { $('#c-rules', bg).insertAdjacentHTML('beforeend', ruleRow()); bindRows(); };
      bindRows();
    },
    onOk: async bg => {
      await call('saveCriteria', { id: cur ? cur.id : '', fromId: from ? from.id : '', typeId: val('#c-type', bg), code: val('#c-code', bg), name: val('#c-name', bg), referenceSource: val('#c-ref', bg),
        effectiveDate: val('#c-eff', bg), isDemo: !!val('#c-demo', bg), conditionsText: val('#c-cond', bg), rules: readRules(bg) });
      toast('บันทึกร่างแล้ว — ตรวจทานแล้วกด "เปิดใช้"', 'ok'); render();
    } });
}

        <br>ค่าที่รับ: highestDegree = ${Object.keys(M().degrees).join('/')} · academicRank = ${Object.keys(M().ranks).join('/')} · employmentStatus = ${Object.keys(M().empStatus).join('/')} · type = ${Object.keys(M().workTypes).join('/')} (หรือชื่อภาษาไทยตามระบบ)</div></details>
    </div></div>
    ${pv ? previewCard(pv) : ''}

  $$('[data-outage]').forEach(x => x.onchange = () => run(async () => { await call('saveSettings', { settings: { ['SIM_OUTAGE_' + x.dataset.outage]: x.checked } }); S.boot = await call('boot'); render(); }));

    const f = await pickFile('.csv'); if (!f) return;
    if (f.size > 3 * 1024 * 1024) throw new Error('ไฟล์ใหญ่เกิน 3 MB');
    const text = await f.text();
    S.cache.preview = await call('importPreview', { source: val('#im-src'), csv: text, fileName: f.name, sourceUpdatedAt: val('#im-date'), note: val('#im-note') });
    render();
  });
  $$('[data-bview]').forEach(b => b.onclick = () => run(async () => { S.cache.preview = await call('importBatch', { batchId: b.dataset.bview }); render(); }));
  const cm = $('#im-commit'); if (cm) cm.onclick = () => run(async () => { const r = await call('importCommit', { batchId: pv.batch.id }); S.cache.preview = null; toast('นำเข้า ' + r.written + ' แถวแล้ว', 'ok'); S.boot = await call('boot'); render(); });
  const dc = $('#im-discard'); if (dc) dc.onclick = () => run(async () => { await call('importDiscard', { batchId: pv.batch.id }); S.cache.preview = null; render(); });
};
function previewCard(pv) {
  const actLabel = { new: '<span class="badge green">เพิ่มใหม่</span>', update: '<span class="badge blue">ปรับปรุง</span>', skip: '<span class="badge red">ข้าม (ผิดพลาด)</span>' };
  const cols = pv.rows.length ? Object.keys(pv.rows[0].data).slice(0, 6) : [];
  return `<div class="card" style="border:2px solid var(--warning)"><div class="card-h"><h3>${ic('eye')} ตรวจทานก่อนนำเข้า: ${esc(pv.batch.fileName || pv.batch.source)}</h3></div><div class="card-b">
    <div class="row mb"><span class="badge green">เพิ่มใหม่ ${pv.summary.new}</span><span class="badge blue">ปรับปรุง ${pv.summary.update}</span><span class="badge red">ข้าม ${pv.summary.skip}</span><span class="small muted">ทั้งหมด ${pv.summary.total} แถว</span></div>
    ${pv.unknownColumns.length ? `<div class="banner amber mb">${ic('alert')}<div><div class="sub">คอลัมน์ที่ไม่รู้จัก (จะไม่นำเข้า): ${esc(pv.unknownColumns.join(', '))}</div></div></div>` : ''}
    ${pv.batch.status === 'preview' ? `<div class="row mb"><button class="btn primary" id="im-commit" ${pv.summary.new + pv.summary.update ? '' : 'disabled'}>${ic('check')} ยืนยันนำเข้า ${pv.summary.new + pv.summary.update} แถว</button><button class="btn" id="im-discard">ยกเลิกชุดนี้</button></div>` : ''}
    <div class="table-wrap"><table class="t"><thead><tr><th>แถว</th><th>ผล</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}<th>ข้อผิดพลาด</th></tr></thead><tbody>
    ${pv.rows.map(r => `<tr><td>${r.rowNo}</td><td>${actLabel[r.action]}</td>${cols.map(c => `<td class="small">${esc(r.data[c])}</td>`).join('')}<td class="small" style="color:var(--danger)">${esc(r.errors)}</td></tr>`).join('')}</tbody></table></div>
    ${pv.truncated ? '<div class="small muted">แสดง 300 แถวแรก</div>' : ''}</div></div>`;
}

      ${step(6, 'ผู้มีอำนาจพิจารณา', 'ดูผลตรวจรายเกณฑ์และหลักฐาน บันทึกผลพร้อมเหตุผล (แยกจากผลของระบบ)')}
      ${step(7, 'แจ้งผลและปิดงาน', 'เจ้าหน้าที่แจ้งผลผู้ยื่นในระบบและปิดงาน ประวัติทั้งหมดยังเก็บไว้')}</div></div>
    <div class="stack">
      <div class="card"><div class="card-h"><h3>${ic('q')} ผลตรวจ 3 แบบ</h3></div><div class="card-b small">
        <p>${resultBadge('pass')} ข้อมูลที่ยืนยันแล้วตรงตามเกณฑ์</p>
        <p>${resultBadge('fail')} ข้อมูลที่ยืนยันแล้วและครบถ้วน ไม่ตรงตามเกณฑ์</p>
        <p>${resultBadge('inconclusive')} ยังสรุปไม่ได้ — เช่น ค้นไม่พบ ข้อมูลไม่ครบ ข้อมูลเก่า ระบบต้นทางขัดข้อง ยังไม่ยืนยันตัวบุคคล ผลงานรอตรวจ หรือมีรายการสงสัยว่าซ้ำ <b>กรณีเหล่านี้ระบบจะไม่สรุปว่า "ไม่ผ่าน"</b></p>
        <p>ผลของระบบเป็นข้อมูลประกอบเท่านั้น ผลพิจารณาเป็นของผู้มีอำนาจ</p></div></div>
      <div class="card"><div class="card-h"><h3>${ic('list')} ความหมายของสถานะ</h3></div><div class="card-b tight"><table class="t"><tbody>${Object.keys(st).map(k => `<tr><td>${statusBadge(k)}</td><td class="small">${esc(st[k].next)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><div class="card-h"><h3>${ic('database')} แหล่งข้อมูล</h3></div><div class="card-b small">MUHR (ข้อมูลบุคคล) และ MUREX (ผลงาน) <b>ยังไม่ได้เชื่อมต่อจริง</b> ระบบใช้ข้อมูลจำลองหรือไฟล์ที่ผู้ดูแลนำเข้า ทุกรายการแสดงป้ายที่มาของข้อมูล และวันที่ดึงข้อมูล</div></div>
    </div></div>`);
};

/* ---------------- เริ่มต้น ---------------- */
function initChrome() {
  const dark = () => document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const setIcon = () => { $('#theme-btn').innerHTML = ic(dark() ? 'sun' : 'moon'); };
  $('#theme-btn').onclick = () => { const t = dark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('rv-theme', t); } catch (e) { /* ignore */ } setIcon(); };
  setIcon();
  $('#menu-btn').innerHTML = ic('menu');
  $('#menu-btn').onclick = () => { $('#sidebar').classList.add('open'); $('#backdrop').classList.add('open'); };
  $('#backdrop').onclick = closeSide;
  $('#bell-btn').onclick = () => S.boot && S.boot.user && go('notifications');
  $('#user-chip').onclick = e => { e.stopPropagation(); $('#user-menu').classList.toggle('open'); };
  document.addEventListener('click', () => $('#user-menu').classList.remove('open'));
}

window.__rvBooted = true;
initChrome();
const h = (location.hash || '').replace('#', '').split('/');
if (h[0] && PAGES[h[0]]) { S.page = h[0]; if (h[1]) S.params = { id: h[1] }; }
run(() => reboot());
})();
</script>
