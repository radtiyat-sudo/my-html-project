<style>
/* ส่วนเสริมเฉพาะระบบตรวจสอบผลงานและคุณสมบัติ (ใช้ร่วมกับ Styles ของ MUGR) */
.skip{position:absolute;left:-999px;top:0;background:var(--primary);color:#fff;padding:8px 14px;z-index:999;border-radius:0 0 10px 0}
.skip:focus{left:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 60%,transparent);outline-offset:2px}
.user-chip{font:inherit;color:inherit;text-align:left}
.bell{position:relative}
.bell .n{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:20px;font-size:11px;font-weight:700;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.mode-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 28px;font-size:13.5px;background:var(--warning-soft);color:var(--warning);border-bottom:1px solid color-mix(in srgb,var(--warning) 25%,transparent)}
.mode-banner b{color:var(--text)}
.steps{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px;border-bottom:1px solid var(--border);overflow-x:auto}
.steps button{border:0;background:none;padding:12px 10px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.steps button .no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:2px solid currentColor;flex:none}
.steps button.on{color:var(--primary);border-color:var(--primary)}
.steps button.done .no{background:var(--success);border-color:var(--success);color:#fff}
.steps button.warn .no{background:var(--warning);border-color:var(--warning);color:#fff}
.steps button .lock{opacity:.7}
.req-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.req-head .t{flex:1;min-width:240px}
.req-head h2{margin:2px 0 6px;font-size:20px;line-height:1.35}
.nextbox{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--border-strong);margin-top:12px}
.nextbox b{display:block}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border)}
.timeline li:last-child{border-bottom:0}
.timeline .dotc{width:12px;height:12px;border-radius:50%;background:var(--primary);margin-top:6px;flex:none}
.timeline .when{font-size:12.5px;color:var(--muted)}
.res{display:inline-flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.res.pass{color:var(--success)} .res.fail{color:var(--danger)} .res.inconclusive{color:var(--warning)}
.overall{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:14px;border:2px solid}
.overall.pass{border-color:var(--success);background:var(--success-soft)}
.overall.fail{border-color:var(--danger);background:var(--danger-soft)}
.overall.inconclusive{border-color:var(--warning);background:var(--warning-soft)}
.overall .big{font-size:20px;font-weight:700}
.ul-tight{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--text-2)}
.ul-tight li{margin:2px 0}
.pick-card{padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;border:2px solid var(--border);border-radius:14px;background:var(--surface);text-align:left;font:inherit;color:inherit}
.pick-card:hover,.pick-card.on{border-color:var(--primary)}
.pick-card.on{background:var(--primary-soft)}
.acc-card{padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:left;font:inherit;color:inherit;width:100%}
.acc-card:hover{border-color:var(--primary)}
.rule-row{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline-form .field{flex:1;min-width:160px}
.dup{border:1px solid color-mix(in srgb,var(--warning) 40%,transparent);background:var(--warning-soft);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.dup .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.dup .pair > div{background:var(--surface);border-radius:10px;padding:10px;border:1px solid var(--border);font-size:13.5px}
.locked{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;padding:8px 0}
.pre{white-space:pre-wrap}
.def{font-size:13px;color:var(--text-2)}
.def dt{font-weight:700;margin-top:8px}
.def dd{margin:2px 0 0}
table.t td .sub{display:block}
@media (max-width:900px){ .mode-banner{padding:9px 16px;font-size:12.5px;gap:4px 10px} .mode-banner > span[aria-hidden]{display:none} .dup .pair{grid-template-columns:1fr} }
</style>
