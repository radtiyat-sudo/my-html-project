<script>
(function () {
'use strict';
/* ระบบตรวจผลงานวิชาการอัตโนมัติ (เว็บสาธารณะ) — เรียกเซิร์ฟเวอร์ผ่าน google.script.run.checkerApi(action, payload) */

const C = { meta: null, tab: 'name', token: '', res: null, sel: new Set(), doc: null, docText: '', admin: null, keyTest: null, form: { fromYear: '' } };
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt2 = n => (Number(n) || 0).toFixed(2);
const opt = (v, l, sel) => `<option value="${esc(v)}"${String(sel) === String(v) ? ' selected' : ''}>${esc(l)}</option>`;
const store = { get(k) { try { return JSON.parse(localStorage.getItem('mugr-ck-' + k) || 'null'); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('mugr-ck-' + k, JSON.stringify(v)); } catch (e) { /* blocked */ } } };

const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 2.82 1.17l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  'alert-triangle': '<path d="m10.29 3.86-8.47 14.14A2 2 0 0 0 3.53 21h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  'check-circle': '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>', 'x-circle': '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>', printer: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>', save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>'
};
const ic = (n, cls) => `<svg class="i ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ICONS.info}</svg>`;

/* ---------- server ---------- */
let busyN = 0;
const busy = on => { busyN += on ? 1 : -1; $('#busy').classList.toggle('on', busyN > 0); };
function call(action, payload) {
  busy(true);
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(r => {
      busy(false);
      if (!r || !r.ok) { const e = new Error(r ? r.error : 'เกิดข้อผิดพลาด'); e.shown = true; toast(e.message, 'err'); return reject(e); }
      resolve(r.data);
    }).withFailureHandler(err => { busy(false); const e = new Error(err && err.message ? err.message : String(err)); e.shown = true; toast(e.message, 'err'); reject(e); })
      .checkerApi(action, Object.assign({ token: C.token }, payload || {}));
  });
}
const run = fn => Promise.resolve().then(fn).catch(e => { if (!e.shown) toast(e.message, 'err'); });
function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = ic(kind === 'err' ? 'x-circle' : kind === 'ok' ? 'check-circle' : 'info') + '<span style="white-space:pre-line">' + esc(msg) + '</span>';
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), kind === 'err' ? 7000 : 3500);
}

/* ---------- theme ---------- */
const effTheme = () => document.documentElement.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function paintTheme() { $('#theme-btn').innerHTML = ic(effTheme() === 'dark' ? 'sun' : 'moon'); }
$('#theme-btn').addEventListener('click', () => { const t = effTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('mugr-theme', t); } catch (e) { /* blocked */ } paintTheme(); });

/* ---------- helpers ---------- */
const DB = () => C.meta.databases;
function dbBadge(w) {
  const d = DB()[w.database] || DB().none;
  const cls = d.group === 'kpa_intl' ? 'purple' : d.group === 'tci1' ? 'green' : d.group === 'tci2' ? 'teal' : 'gray';
  return `<span class="badge ${cls}">${esc(d.short)}${w.quartile ? ' ' + esc(w.quartile) : ''}</span>`;
}
function groupBadge(w) {
  if (w.type && w.type !== 'journal') return '<span class="badge gold">' + esc((C.meta.pubTypes[w.type] || {}).label || w.type) + '</span>';
  if (w.confidence === 'unknown') return '<span class="badge gray">ไม่พบในรายชื่อ</span>';
  if (w.group === 'kpa_intl') return '<span class="badge purple">นานาชาติ (ก.พ.อ.)</span>';
  if (w.group === 'tci1' || w.group === 'tci2') return '<span class="badge green">ระดับชาติ (TCI)</span>';
  return '<span class="badge gray">ไม่นับตามประกาศ</span>';
}
const DB_GROUPS = [
  { title: 'กลุ่มที่ 1 · ฐานข้อมูลระดับนานาชาติตามประกาศ ก.พ.อ.', cls: 'purple', subs: [['scopus', 'Scopus'], ['wos', 'Web of Science (SCIE / SSCI / AHCI)'], ['pubmed', 'PubMed'], ['eric', 'ERIC'], ['other_kpa', 'MathSciNet / JSTOR / Project Muse']] },
  { title: 'กลุ่มที่ 2 · ฐานข้อมูลระดับชาติตามประกาศ ก.พ.อ. (TCI)', cls: 'green', subs: [['tci1', 'TCI กลุ่มที่ 1'], ['tci2', 'TCI กลุ่มที่ 2']] },
  { title: 'กลุ่มที่ 3 · Proceedings / หนังสือ / วารสารที่สภาสถาบันอนุมัติ', cls: 'gold', subs: [['other', 'ผลงานประเภทอื่น']] },
  { title: 'กลุ่มที่ 4 · ไม่อยู่ในฐานตามประกาศ หรือยังระบุไม่ได้', cls: 'gray', subs: [['none', 'ตรวจด้วยตนเอง']] }
];
function bucketOf(w) {
  if (w.type !== 'journal') return 'other';
  if (w.group === 'kpa_intl') return ['scopus', 'wos', 'pubmed', 'eric'].indexOf(w.database) > -1 ? w.database : 'other_kpa';
  if (w.database === 'tci1' || w.database === 'tci2') return w.database;
  if (w.group === 'other_intl' || w.group === 'other_nat') return 'other';
  return 'none';
}
const SRC_NAME = { scopus: 'Scopus', wos: 'WoS', pubmed: 'PubMed', eric: 'ERIC' };
const empty = msg => `<div class="empty">${ic('list')}<div>${esc(msg)}</div></div>`;
function readForm(root) { const d = {}; $$('[name]', root).forEach(el => { d[el.name] = el.type === 'checkbox' ? el.checked : el.value; }); return d; }

/* ---------- render ---------- */
function render() {
  const m = C.meta, w = m.window;
  $('#ck-org').textContent = 'ตามประกาศ ก.พ.อ. พ.ศ. 2562 · ผู้รวบรวม: ' + m.org;
  const tabs = [['name', 'ค้นจากชื่อ ไทย-อังกฤษ', 'search'], ['file', 'ตรวจจากไฟล์ / DOI', 'file'], ['admin', 'ผู้ดูแล', 'lock']];
  const ji = m.journalIndex || { total: 0, byDatabase: {} };
  $('#content').innerHTML = `
  <section class="hero no-print"><span class="chip">${ic('shield', 'sm')} ตรวจผลงานวิชาการตามประกาศ ก.พ.อ. พ.ศ. 2562</span>
    <h2>ตรวจว่าผลงานอยู่ในฐานข้อมูลใด</h2>
    <p>กรอกชื่อนักวิจัยภาษาไทย-อังกฤษ หรือแนบไฟล์บทความ ระบบค้นฐานใหญ่ก่อนตามลำดับ แล้วแบ่งผลงานเป็นกลุ่มนานาชาติ / ระดับชาติ พร้อมน้ำหนักคะแนนและหลักฐาน รอบประเมิน ${w.start}–${w.end}</p>
    <div class="steps"><span>1 Scopus</span><span>2 Web of Science</span><span>3 PubMed</span><span>4 ERIC</span><span>5 TCI / ThaiJO</span><span>6 OpenAlex</span></div></section>
  <div class="row mt no-print small">
    <span class="badge ${m.keys.SCOPUS_API_KEY ? 'green' : 'amber'}">Scopus: ${m.keys.SCOPUS_API_KEY ? 'ค้นโดยตรง' : 'ตรวจผ่านรายชื่อ SJR'}</span>
    <span class="badge ${m.keys.WOS_API_KEY ? 'green' : 'gray'}">Web of Science: ${m.keys.WOS_API_KEY ? 'ค้นโดยตรง' : 'ตรวจผ่านรายชื่อ ISSN'}</span>
    <span class="badge green">PubMed / ERIC: ค้นโดยตรง</span>
    <span class="badge ${ji.total ? 'blue' : 'amber'}">รายชื่อวารสาร: ${ji.total ? Object.keys(ji.byDatabase).map(k => (DB()[k] || {}).short + ' ' + ji.byDatabase[k].toLocaleString()).join(' · ') : 'ยังไม่ได้นำเข้า'}</span>
  </div>
  <div class="card mt"><div class="tabs no-print">${tabs.map(t => `<button class="${C.tab === t[0] ? 'on' : ''}" data-tab="${t[0]}">${ic(t[2], 'sm')} ${t[1]}</button>`).join('')}</div>
    <div class="card-b">${C.tab === 'name' ? nameForm() : C.tab === 'file' ? fileForm() : adminPanel()}</div></div>
  <div id="results" class="mt">${C.tab === 'name' ? results() : C.tab === 'file' ? docResult() : ''}</div>`;
  paintTheme();
}

function requesterFields() {
  const r = store.get('requester') || {};
  return `<div class="field"><label for="q-req">ชื่อผู้ตรวจ / ผู้ส่ง</label><input class="input" id="q-req" name="requester" value="${esc(r.requester || '')}" placeholder="ใช้เมื่อส่งผลให้ผู้รวบรวม"></div>
    <div class="field"><label for="q-org">หน่วยงาน / หลักสูตร</label><input class="input" id="q-org" name="org" value="${esc(r.org || '')}" placeholder="เช่น หลักสูตร ปร.ด. ประชากรศึกษา"></div>`;
}

function nameForm() {
  const f = C.form;
  return `<form id="q-form" class="form-grid" novalidate>
    <div class="field"><label for="q-th">ชื่อ-สกุล ภาษาไทย</label><input class="input" id="q-th" name="nameTh" value="${esc(f.nameTh || '')}" placeholder="เช่น นภา ตัวอย่างดี"><div class="hint">ค้นวารสารไทย (TCI/ThaiJO)</div></div>
    <div class="field"><label for="q-en">ชื่อ-สกุล ภาษาอังกฤษ</label><input class="input" id="q-en" name="nameEn" value="${esc(f.nameEn || '')}" placeholder="Firstname Lastname"><div class="hint">ค้น Scopus, Web of Science, PubMed, ERIC, OpenAlex</div></div>
    <div class="field"><label for="q-sc">Scopus Author ID (ถ้ามี)</label><input class="input" id="q-sc" name="scopusId" value="${esc(f.scopusId || '')}" placeholder="เช่น 57200000000"><div class="hint">แม่นยำที่สุด ไม่ปนกับคนชื่อซ้ำ</div></div>
    <div class="field"><label for="q-orcid">ORCID (ถ้ามี)</label><input class="input" id="q-orcid" name="orcid" value="${esc(f.orcid || '')}" placeholder="0000-0000-0000-0000"></div>
    <div class="field"><label for="q-from">ตั้งแต่ปี พ.ศ.</label><input class="input" id="q-from" name="fromYear" type="number" min="2500" max="2700" value="${esc(f.fromYear || C.meta.window.start)}"></div>
    <div class="field"><label for="q-mail">อีเมลผู้ตรวจ (ถ้ามี)</label><input class="input" id="q-mail" name="email" type="email" value="${esc((store.get('requester') || {}).email || '')}"></div>
    ${requesterFields()}
  </form><div class="row mt"><button class="btn primary" data-act="search">${ic('search', 'sm')} ค้นหาทุกฐาน (เริ่มจาก Scopus)</button>${C.res ? `<button class="btn" data-act="reset">${ic('refresh', 'sm')} เริ่มใหม่</button>` : ''}</div>`;
}

function statusPanel() {
  const mb = m => m === 'direct' ? '<span class="badge green">ค้นโดยตรง</span>' : m === 'list' ? '<span class="badge amber">ตรวจผ่านรายชื่อ ISSN</span>' : m === 'error' ? '<span class="badge red">ผิดพลาด</span>' : '<span class="badge gray">ข้าม</span>';
  return `<div class="card"><div class="card-h"><h2>${ic('list')} ลำดับการค้นหา (ฐานใหญ่ก่อน)</h2></div><div class="table-wrap"><table class="t"><thead><tr><th class="c">ลำดับ</th><th>ฐานข้อมูล</th><th>วิธีค้น</th><th class="num">พบ</th><th>รายละเอียด</th></tr></thead><tbody>
    ${C.res.status.map(s => `<tr><td class="c"><b>${s.step}</b></td><td><b>${esc(s.label)}</b></td><td>${mb(s.mode)}</td><td class="num"><b>${s.count}</b></td><td class="small">${esc(s.message || '')}
      ${s.key === 'openalex' && C.res.candidates && C.res.candidates.length > 1 ? `<div class="row mt-s no-print"><select class="select" id="q-oa" style="width:auto;min-width:240px">${C.res.candidates.map(c => opt(c.id, c.name + (c.institution ? ' — ' + c.institution : '') + ' (' + c.works + ')', C.res.openalexId)).join('')}</select><button class="btn sm" data-act="oa">ใช้นักวิจัยคนนี้</button></div>` : ''}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}

function workRow(w, i) {
  return `<tr><td class="no-print"><input type="checkbox" class="sel" data-i="${i}" ${C.sel.has(i) ? 'checked' : ''}></td>
    <td style="min-width:260px"><div class="title">${esc(w.title)}</div><div class="sub">${esc(w.journal)}${w.doi ? ` · <a href="https://doi.org/${esc(w.doi)}" target="_blank">DOI</a>` : ''}</div>
      ${w.authors && w.authors.length ? `<div class="sub">${esc(w.authors.slice(0, 5).join(', '))}${w.authors.length > 5 ? ' …' : ''}</div>` : ''}
      <div class="chips mt-s">${(w.foundIn || []).map(k => `<span class="badge blue">พบใน ${esc(SRC_NAME[k] || k)}</span>`).join('')}<span class="badge gray">ที่มา: ${esc((w.origins || [w.origin]).join(', '))}</span></div></td>
    <td><b>${w.year || '—'}</b><div>${w.expired ? '<span class="badge red">เกิน 5 ปี</span>' : ''}</div></td>
    <td>${w.type === 'journal' && w.database !== 'none' ? dbBadge(w) : groupBadge(w)}${w.confidence === 'medium' ? ' <span class="badge amber">ควรตรวจซ้ำ</span>' : ''}${w.type === 'journal' && w.database !== 'none' && (w.foundIn || []).indexOf(w.database) === -1 ? ' <span class="badge gray">ยืนยันจากรายชื่อ ISSN</span>' : ''}
      <details class="small muted" style="margin-top:6px"><summary style="cursor:pointer">หลักฐาน (${(w.evidence || []).length})</summary><ul style="margin:4px 0 0;padding-left:16px">${(w.evidence || []).map(e => `<li>${esc(e)}</li>`).join('')}</ul></details></td>
    <td class="num"><b>${fmt2(w.weight)}</b></td></tr>`;
}

function results() {
  if (!C.res) return '';
  const r = C.res, s = r.summary, idx = r.works.map((w, i) => ({ w, i }));
  let html = statusPanel();
  html += `<div class="card mt"><div class="card-h"><h2>${ic('file')} ผลงานที่พบ ${r.works.length} รายการ — ${esc([C.form.nameTh, C.form.nameEn].filter(String).join(' / '))}</h2></div>
    <div class="toolbar"><div class="chips"><span class="badge purple">นานาชาติ ${s.intl}</span><span class="badge green">ระดับชาติ TCI ${s.nat}</span><span class="badge gold">อื่น ๆ ${s.other}</span><span class="badge gray">ยังระบุไม่ได้ ${s.unknown}</span><span class="badge blue">ในรอบ 5 ปี ${s.inWindow}</span></div>
    <span style="flex:1"></span><label class="check small no-print"><input type="checkbox" id="sel-all"> เลือกทั้งหมด</label></div></div>`;
  DB_GROUPS.forEach(g => {
    const subs = g.subs.map(sb => ({ label: sb[1], rows: idx.filter(x => bucketOf(x.w) === sb[0]) }));
    const n = subs.reduce((a, b) => a + b.rows.length, 0);
    html += `<div class="card mt"><div class="card-h"><h2><span class="badge ${g.cls}" style="font-size:13px">${n}</span> ${esc(g.title)}</h2></div>`;
    if (!n) html += `<div class="card-b small muted">ไม่พบผลงานในกลุ่มนี้</div>`;
    subs.filter(sb => sb.rows.length).forEach(sb => {
      html += `<div class="toolbar" style="background:var(--surface-2)"><b>${esc(sb.label)}</b><span class="badge gray">${sb.rows.length} รายการ</span></div>
        <div class="table-wrap"><table class="t"><thead><tr><th class="no-print"></th><th>ผลงาน</th><th>ปี</th><th>ผลการตรวจตามประกาศ</th><th class="num">น้ำหนัก</th></tr></thead><tbody>${sb.rows.map(x => workRow(x.w, x.i)).join('')}</tbody></table></div>`;
    });
    html += `</div>`;
  });
  html += `<div class="card mt no-print"><div class="toolbar" style="border-bottom:0">
    <button class="btn primary" data-act="submit">${ic('send', 'sm')} ส่งผลที่เลือก <span id="sel-n">${C.sel.size}</span> รายการให้ผู้รวบรวม</button>
    <button class="btn" data-act="csv">${ic('download', 'sm')} ดาวน์โหลด CSV</button>
    <button class="btn" data-act="print">${ic('printer', 'sm')} พิมพ์</button>
    <span class="small muted">ผลที่ส่งจะถูกบันทึกในระบบของผู้รวบรวม (${esc(C.meta.org)})</span></div></div>`;
  return html;
}

/* ---------- file / DOI ---------- */
function fileForm() {
  return `<div class="stack" style="gap:14px">
    <div class="field"><label for="f-file">ไฟล์บทความ (PDF หรือ .txt)</label><input class="input" style="padding:7px 10px;height:auto" type="file" id="f-file" accept=".pdf,.txt,application/pdf,text/plain">
      <div class="hint">ระบบอ่านข้อความ 3 หน้าแรกในเบราว์เซอร์ของคุณเพื่อหา DOI / ISSN — ไฟล์ไม่ถูกอัปโหลด · ไฟล์สแกนเป็นภาพให้พิมพ์ DOI แทน</div></div>

/* --- pdf.js --- */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
function loadPdfJs() {
  const lib = () => window.pdfjsLib || window['pdfjs-dist/build/pdf'];
  if (lib()) return Promise.resolve(lib());
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('โหลดตัวอ่าน PDF ไม่สำเร็จภายใน 20 วินาที — พิมพ์ DOI แทน')), 20000);
    const s = document.createElement('script');
    s.src = PDFJS + 'pdf.min.js';
    s.onerror = () => { clearTimeout(timer); reject(new Error('โหลดตัวอ่าน PDF ไม่สำเร็จ — พิมพ์ DOI แทน')); };
    s.onload = () => {
      const L = lib();
      fetch(PDFJS + 'pdf.worker.min.js').then(r => r.text())
        .then(t => { L.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' })); clearTimeout(timer); resolve(L); })
        .catch(() => { L.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; clearTimeout(timer); resolve(L); });
    };
    document.head.appendChild(s);
  });
}
async function readFileText(file) {
  if (/\.txt$/i.test(file.name) || file.type === 'text/plain') return { text: await file.text(), title: '' };
  const L = await loadPdfJs();
  const pdf = await L.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let text = '';
  for (let i = 1; i <= Math.min(3, pdf.numPages); i++) { const c = await (await pdf.getPage(i)).getTextContent(); text += c.items.map(x => x.str).join(' ') + '\n'; }
  let title = '';
  try { const meta = await pdf.getMetadata(); title = (meta && meta.info && meta.info.Title) || ''; } catch (e) { /* none */ }
  return { text, title };
}
function guessTitle(text) {
  return String(text).split(/\n|\s{3,}/).map(s => s.trim()).filter(s => s.length > 25 && s.length < 250 && !/doi|issn|copyright|©|http|vol\.|journal|received|accepted/i.test(s))[0] || '';
}

function parseCsv(text) {
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.indexOf('\t') > -1 ? '\t' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"') q = true; else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}
function journalRowsFromCsv(text) {
  const rows = parseCsv(text.replace(/^﻿/, ''));
  if (rows.length < 2) throw new Error('ไฟล์ไม่มีข้อมูล');
  const h = rows[0].map(x => String(x).trim().toLowerCase());
  const issnCols = h.map((x, i) => /issn/.test(x) ? i : -1).filter(i => i >= 0);
  const titleCol = h.findIndex(x => /title|journal|ชื่อ/.test(x));
  const qCol = h.findIndex(x => /quartile/.test(x));
  if (!issnCols.length) throw new Error('ไม่พบคอลัมน์ ISSN ในแถวหัวตาราง');
  return rows.slice(1).map(r => ({ title: titleCol >= 0 ? r[titleCol] : '', quartile: qCol >= 0 ? String(r[qCol] || '').trim() : '',
    issns: issnCols.flatMap(i => String(r[i] || '').split(/[,;\s]+/)).filter(x => x.replace(/[^0-9Xx]/g, '').length === 8) })).filter(r => r.issns.length);
}
