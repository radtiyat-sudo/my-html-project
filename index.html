<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบประเมิน PLO วิทยานิพนธ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef2f6; --ink:#14202b; --muted:#5b6773; --line:#dbe1e7; --grid:#e3e8ed;
  --accent:#1f5fae; --accent-tint:#e3eefb; --accent-ink:#ffffff;
  --s1:#2a78d6;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --cx:#8b96a1;
  --good:#17753f; --good-tint:#e1f3e8; --warn:#8f5200; --warn-tint:#fbefd5; --bad:#b3261e; --bad-tint:#fbe4e1;
  --f-head:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif; --f-body:"Noto Sans Thai","IBM Plex Sans Thai",system-ui,sans-serif;
}
/* โหมดมืด: ตามระบบ (ถ้าไม่ได้เลือกโหมดสว่างเอง) หรือเมื่อกดปุ่มสลับเป็นโหมดมืด */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1418; --surface:#171d23; --surface-2:#1f2730; --ink:#e8edf2; --muted:#9aa6b2; --line:#2b353f; --grid:#2a333c;
  --accent:#5ea2f2; --accent-tint:#1a2c42; --accent-ink:#0b1117;
  --s1:#3987e5;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --cx:#6b7682;
  --good:#47c283; --good-tint:#15291f; --warn:#e3a43a; --warn-tint:#2d2412; --bad:#f07a6e; --bad-tint:#33191a}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1418; --surface:#171d23; --surface-2:#1f2730; --ink:#e8edf2; --muted:#9aa6b2; --line:#2b353f; --grid:#2a333c;
  --accent:#5ea2f2; --accent-tint:#1a2c42; --accent-ink:#0b1117;
  --s1:#3987e5;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --cx:#6b7682;
  --good:#47c283; --good-tint:#15291f; --warn:#e3a43a; --warn-tint:#2d2412; --bad:#f07a6e; --bad-tint:#33191a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{transition:background-color .2s,color .2s;background:var(--bg);color:var(--ink);font:14px/1.6 var(--f-body);padding-inline:16px;padding-block:0 56px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.3}
.wrap{max-width:1200px;margin-inline:auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:progress;opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.brand{font:700 18px/1.3 var(--f-head);cursor:pointer}
.brand small{display:block;font:400 12px var(--f-body);color:var(--muted)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding-block:8px 10px;font-size:13px;color:var(--muted)}
.crumbs a{color:var(--accent);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;color:var(--muted);font:600 14px var(--f-head);white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px}
select,input[type=text],input[type=number],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.stack{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--warn-tint);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px}
.note b{color:var(--warn);white-space:nowrap}
.chip{display:inline-flex;gap:4px;align-items:center;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-tint);color:var(--good)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.chip.bad{background:var(--bad-tint);color:var(--bad)}
.chip.na{background:var(--surface-2);color:var(--muted)}
/* picker */
.hero{margin-bottom:18px}
.hero h1{font-size:24px}
.hero p{margin:4px 0 0;color:var(--muted)}
.search{width:100%;max-width:420px;margin-top:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pick{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.pick:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.pick h3{font-size:16px;margin-bottom:6px}
.pick .meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.pick.add{border-style:dashed;color:var(--muted);display:flex;align-items:center;justify-content:center;min-height:96px}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* kpis & charts */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font:700 28px/1.2 var(--f-head);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)!important}}
.plo-row{display:grid;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.plo-row:first-of-type{border-top:0}
.plo-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.plo-head b{font-family:var(--f-head)}
.plo-head span.t{color:var(--muted);font-size:12px;font-weight:400}
.track{position:relative;height:12px;background:var(--surface-2);border-radius:3px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 4px 4px 0}
.tgt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.plo-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px;border-radius:2px}
.legend i.dash{border-top-style:dashed;border-top-width:2px}
.legend i.sw{width:12px;height:12px;border:0;border-radius:3px;background:currentColor}
svg.radar{width:100%;height:auto;display:block}
svg.radar text{fill:var(--ink);font:500 12px var(--f-body)}
svg.radar text.m{fill:var(--muted);font-size:10px}
.insight{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin-block:8px;font-size:13px}
.table-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrapt{white-space:normal;min-width:200px}
th{font:600 12px var(--f-head);color:var(--muted)}
td.num,th.num{text-align:right}
td.low{color:var(--bad);font-weight:600;background:var(--bad-tint)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.stk{display:flex;gap:2px;height:26px;margin-block:4px 10px}
.stk>div{min-width:0;display:flex;align-items:center;justify-content:center;color:#fff;font:600 11px var(--f-head);border-radius:3px;overflow:hidden;font-variant-numeric:tabular-nums}
.stk>div.dk{color:#10161c}
.stk-l{font-size:12px;color:var(--muted)}
.diff-up{color:var(--warn);font-weight:600}
.diff-dn{color:var(--accent);font-weight:600}
/* matrix */
.matrix-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.matrix{min-width:780px}
.mrow{display:grid;grid-template-columns:minmax(190px,1.1fr) repeat(4,minmax(138px,1fr))}
.mhead{background:var(--surface-2);font:600 12px var(--f-head)}
.mhead div{padding:8px 10px}
.mhead .lv{display:flex;gap:6px;align-items:baseline}
.mhead .lv b{font-size:15px}
.mplo{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 10px;background:var(--accent-tint);border-top:1px solid var(--line);font-size:13px}
.mplo b{font-family:var(--f-head)}
.mplo .pp{font-variant-numeric:tabular-nums;font-weight:600}
.mcrit{padding:10px;border-top:1px solid var(--line);font-size:13px;font-weight:500}
.mcrit small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.cell{text-align:left;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);padding:10px;font-size:12px;line-height:1.5;color:var(--muted);position:relative;min-height:84px}
.cell:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.cell:disabled{cursor:default;opacity:1}
.cell[aria-pressed=true]{background:var(--accent-tint);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.cell[aria-pressed=true]::after{content:"✓";position:absolute;right:8px;top:6px;color:var(--accent);font-weight:700}
.result-sticky{position:sticky;top:130px}
@media (max-width:860px){.result-sticky{position:static}}
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.score b{font:700 40px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--surface-2);border-radius:3px;margin-block:6px 10px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.exp{width:100%;min-height:120px;font:12px/1.5 ui-monospace,Menlo,monospace}
.pair{padding-block:8px;border-top:1px solid var(--line);font-size:13px}
.pair:first-of-type{border-top:0}
.ev{display:grid;gap:4px}
.ev q{font-size:12px;color:var(--muted)}
/* editor */
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.f label{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.f input{width:100%}
.ploedit{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:grid;gap:10px;min-width:0}
.pe-top{display:grid;grid-template-columns:90px minmax(0,1fr) 100px;gap:10px}
@media (max-width:620px){.pe-top{grid-template-columns:minmax(0,1fr)}}
.crit{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
.crit details summary{cursor:pointer;color:var(--muted);font-size:12px}
.lvl-edit{display:grid;gap:6px;margin-top:6px}
.lvl-edit label{font-size:12px;color:var(--muted)}
.savebar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;margin-top:16px}
.savebar .btn{border-color:transparent;color:var(--ink)}
.savebar .btn.primary{color:var(--accent-ink)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:grid;gap:8px;align-content:start}
.step h3{font-size:14px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:12px}
.checks label{display:flex;gap:6px;align-items:center}
.tag-draft{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-tint);border-radius:4px;padding:1px 6px;margin-left:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;z-index:9;max-width:92vw}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s}}

.wrap.wide{max-width:1560px}
.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.slist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;position:sticky;top:132px;max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:1000px){.slist{position:static;max-height:340px}}
.slist input[type=search]{width:100%}
.sitem{display:grid;gap:2px;text-align:left;width:100%;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px}
.sitem:hover{background:var(--surface-2)}
.sitem[aria-current=true]{background:var(--accent-tint);border-color:var(--accent)}
.sitem b{font-family:var(--f-head);font-weight:600}
.sitem small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .row{justify-content:space-between;flex-wrap:nowrap}
.adminbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.mgr{display:grid;gap:12px}
.mgr table td{white-space:normal}
.mgr input[type=text]{width:100%}
.utab{width:100%;border-collapse:collapse}.utab th,.utab td{padding:8px 6px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line, #e3e7ee)}.utab input[type=text]{min-width:180px;width:100%}.utab select{min-width:200px}.utab details summary{cursor:pointer}.utab label.row{flex-wrap:nowrap;align-items:flex-start}.utab input[type=checkbox]{width:auto;min-width:0;flex:none}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.kind{text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;display:grid;gap:2px}
.kind[aria-pressed=true]{border-color:var(--accent);background:var(--accent-tint)}
.kind b{font-family:var(--f-head)}
.kind span{font-size:12px;color:var(--muted)}
.pv td,.pv th{font-size:12px;padding:5px 8px}
.dupe td{color:var(--muted);text-decoration:line-through}

/* scoring (mobile-first) */
.stu-pick{display:none;gap:8px;margin-bottom:12px;align-items:center}
.stu-pick select{flex:1;min-width:0}
.stu-pick .btn{min-width:44px;min-height:44px;font-size:20px}
@media (max-width:1000px){.stu-pick{display:flex}.split>.slist{order:2}}
.scoring{display:grid;gap:14px}
.howto{font-size:12px;color:var(--muted)}
.plo-sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plo-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start;padding:10px 14px;background:var(--accent-tint);font-size:14px}
.plo-h b{font-family:var(--f-head)}
.plo-h-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plo-h .pp{font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.crit-card{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.crit-name{font-weight:600;font-size:14px}
.crit-name small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.lvls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lvl{display:grid;gap:0;justify-items:center;align-content:center;min-height:56px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-align:center}
.lvl b{font:700 20px/1.2 var(--f-head)}
.lvl span{font-size:11px;color:var(--muted);line-height:1.3}
.lvl:hover:not(:disabled){background:var(--surface-2)}
.lvl[aria-pressed=true],.lvl[aria-pressed=true]:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvl[aria-pressed=true] span{color:var(--accent-ink)}
.lvl:disabled{cursor:default;opacity:.6}
.lvl-desc{font-size:13px;line-height:1.55;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.lvl-desc.empty-d{color:var(--muted);background:none;padding:0 2px;font-size:12px}
.lvl-all summary{cursor:pointer;color:var(--muted);font-size:12px;padding-block:2px}
.lvl-line{font-size:12px;color:var(--muted);padding:4px 0;border-top:1px dashed var(--line)}
.lvl-line.on{color:var(--ink);font-weight:500}
.lvl-line b{color:var(--ink)}
.sticky-bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:8px 12px;box-shadow:0 4px 18px rgba(0,0,0,.18);font-size:13px}
.sb-score b{font:700 20px var(--f-head);font-variant-numeric:tabular-nums}
/* เกณฑ์ 5 ช่วงคะแนน A-E (เต็ม 10) */
.bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.band{display:grid;gap:4px;align-content:start;border:1px solid var(--line);border-top:3px solid var(--bc,var(--line));border-radius:10px;padding:6px;background:var(--surface);min-width:0}
.band.good{--bc:var(--good)}.band.warn{--bc:var(--warn)}.band.bad{--bc:var(--bad)}
.band.on{background:var(--accent-tint);border-color:var(--accent);border-top-color:var(--bc)}
.band-h{text-align:center;line-height:1.25;padding-bottom:2px}
.band-h b{display:block;font:700 15px var(--f-head)}
.band-h small{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.band-h span{display:block;font-size:10.5px;color:var(--muted)}
.band .lvl{min-height:40px;padding:4px}
.band .lvl b{font-size:18px}
.chip.band-chip{font-variant-numeric:tabular-nums}
.theme-btn{min-width:44px}
@media (max-width:480px){.bands{gap:4px}.band{padding:4px}.band-h span{display:none}.band .lvl{min-height:44px}.plo-h{padding:10px 12px}.crit-card{padding:12px}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="top-row">
    <div class="brand" id="brand" role="link" tabindex="0">ระบบประเมิน PLO วิทยานิพนธ์<small>เลือกส่วนงาน → หลักสูตร → ใช้ PLO เป็นตัวชี้วัด</small></div>
    <div class="who" id="who"></div>
  </div>

</div></div>

<script>
(function(){
"use strict";
/* เกณฑ์การประเมิน 5 ช่วงคะแนน ใช้เหมือนกันทุก PLO (แต่ละเกณฑ์ให้ 0-10) */
var MAX=10;
var BANDS=[{k:"A",n:"สูงกว่าเป้าหมายมาก",min:9,max:10,c:"good"},{k:"B",n:"ตามเป้าหมาย",min:7,max:8,c:"good"},{k:"C",n:"ใกล้เคียงเป้าหมาย",min:5,max:6,c:"warn"},{k:"D",n:"ต่ำกว่าเป้าหมาย",min:3,max:4,c:"bad"},{k:"E",n:"ต่ำกว่าเป้าหมายมาก",min:0,max:2,c:"bad"}];
function isNum(v){return typeof v==="number"&&!isNaN(v)}
function bandIdx(v){var r=Math.round(v);for(var i=0;i<BANDS.length;i++)if(r>=BANDS[i].min)return i;return BANDS.length-1}
function bandRange(b){return b.min+"-"+b.max}
function scoresOf(b){var o=[];for(var v=b.max;v>=b.min;v--)o.push(v);return o}
function ten(pct){return pct==null||isNaN(pct)?"–":(pct/10).toFixed(1)}
var SAMPLE_EMAIL="sample@example.com";
var G={boot:null,me:{role:"viewer",email:"",name:""},view:"home",facId:null,P:null,tab:"exec",stuId:null,q:"",lq:"",
  exp:{kind:"people",stu:null},dirty:false,busy:{},cross:null,blend:{},items:[],preview:null,importMode:"replace",impText:"",
  showAdd:false,confirmDel:null,autoDraft:true,theme:null,
  admin:{tab:"prog",facId:null,progId:null,users:null,roster:{text:"",list:null}}};

/* ---------- utils ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(x){return x==null||isNaN(x)?"–":Math.round(x)}
function $(id){return document.getElementById(id)}
function call(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    if(!window.google||!google.script||!google.script.run){rej(new Error("เปิดหน้านี้ผ่าน Web app ของ Apps Script"));return}
    var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e)});
    r[fn].apply(r,args);
  });
}
function errMsg(e){return (e&&e.message?e.message:String(e)).replace(/^Error:\s*/,"")}
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3800)}
function fail(e){toast(errMsg(e))}
function canEdit(){return G.me.role==="admin"}
function canCurr(){return G.me.role==="admin"||G.me.role==="curriculum"}
function canScore(){return G.me.role==="admin"||G.me.role==="evaluator"}
function rid(p){return p+Math.random().toString(36).slice(2,10)}
var ROLE_TH={admin:"ผู้ดูแลระบบ",curriculum:"เจ้าหน้าที่หลักสูตร",evaluator:"อาจารย์ผู้ประเมิน",executive:"ผู้บริหาร (ดูอย่างเดียว)",viewer:"ผู้ชม (ดูอย่างเดียว)"};
/* ร่างคำอธิบายอัตโนมัติของช่วง i (0=A … 4=E) เมื่อยังไม่ได้เขียนเอง */
function gen(n,i){return [
  n+"ได้ครบถ้วน ลึกซึ้ง เกินความคาดหวังของระดับปริญญา มีหลักฐานชัดเจนและเชื่อมโยงกับงานของตนอย่างสร้างสรรค์ (10 = โดดเด่นทุกด้าน, 9 = โดดเด่นเกือบทุกด้าน)",
  n+"ได้ถูกต้องครบตามเป้าหมาย มีหลักฐานสนับสนุน (8 = ครบและมั่นคง, 7 = ครบแต่ความลึกยังไม่สม่ำเสมอ)",
  n+"ได้เป็นส่วนใหญ่ แต่ยังมีช่องว่างหรือข้อผิดพลาดที่ต้องแก้ไข (6 = ขาดเล็กน้อย, 5 = ขาดหลายจุด)",
  n+"ได้บางส่วน มีข้อผิดพลาดสำคัญ ต้องปรับปรุง (4 = ทำได้บางส่วนเมื่อได้รับคำแนะนำ, 3 = ทำได้น้อย)",
  n+"ไม่ได้หรือไม่มีหลักฐาน (2 = มีความพยายามแต่ไม่ถึงเกณฑ์, 1 = แทบไม่มีหลักฐาน, 0 = ไม่มีเลย)"][i]}
function desc(c,i){return c.desc&&c.desc[i]?c.desc[i]:gen(c.name,i)}
function cleanEn(t){return String(t||"").replace(/\(draft wording[^)]*\)/i,"").trim()}
function facOf(id){return G.boot.faculties.find(function(x){return x.id===id})}
function progMeta(id){var r=null;G.boot.faculties.forEach(function(f){f.programs.forEach(function(p){if(p.id===id)r=p})});return r}

/* ---------- scoring ---------- */
function evalsOf(stId){
  var all=G.P.evals.filter(function(e){return e.studentId===stId});
  var real=all.filter(function(e){return e.email!==SAMPLE_EMAIL});
  return real.length?real:all;
}
function meanOf(list){
  var acc={};
  list.forEach(function(e){Object.keys(e.scores||{}).forEach(function(c){var v=e.scores[c];if(isNum(v))(acc[c]=acc[c]||[]).push(v)})});
  var out={};Object.keys(acc).forEach(function(c){out[c]=acc[c].reduce(function(a,b){return a+b},0)/acc[c].length});
  return out;
}
function ploPct(p,sc){var s=0,n=0;p.crit.forEach(function(c){var v=sc[c.id];if(isNum(v)){s+=v;n++}});return {pct:n?s/(MAX*n)*100:null,done:n,total:p.crit.length}}
function evalStu(pr,sc){
  var rows=pr.plos.map(function(p){var r=ploPct(p,sc);r.p=p;return r});
  var complete=rows.length>0&&rows.every(function(r){return r.done===r.total});
  var wsum=0,acc=0;rows.forEach(function(r){if(r.pct!=null){wsum+=r.p.weight;acc+=r.p.weight*r.pct}});
  var total=wsum?acc/wsum:null;
  var passed=rows.filter(function(r){return r.pct!=null&&r.pct>=pr.set.ploPass}).length;
  var frac=rows.length?passed/rows.length*100:0;
  var ok=complete&&total!=null&&total>=pr.set.overall&&frac>=pr.set.fraction-1e-9;
  var cnt=rows.reduce(function(a,r){return a+r.done},0),tot=rows.reduce(function(a,r){return a+r.total},0);
  return {rows:rows,complete:complete,total:total,passed:passed,frac:frac,ok:ok,cnt:cnt,tot:tot};
}
function norm100(map,ids){
  var raw=ids.map(function(id){return Math.max(0,Number(map&&map[id])||0)}),sum=raw.reduce(function(a,b){return a+b},0);
  if(!sum)return null;
  var sc=raw.map(function(v){return v/sum*100}),fl=sc.map(Math.floor),rem=100-fl.reduce(function(a,b){return a+b},0);
  sc.map(function(v,i){return [v-fl[i],i]}).sort(function(a,b){return b[0]-a[0]}).slice(0,rem).forEach(function(x){fl[x[1]]++});
  var out={};ids.forEach(function(id,i){out[id]=fl[i]});return out;
}
function wpct(pr,p){var t=pr.plos.reduce(function(a,x){return a+Number(x.weight||0)},0);return t?Math.round(p.weight/t*1000)/10:0}
function weightShare(pr){var m={};pr.plos.forEach(function(p){m[p.id]=p.weight});return norm100(m,pr.plos.map(function(p){return p.id}))}
function overlap(a,b,ids){return ids.reduce(function(s,id){return s+Math.min(a[id]||0,b[id]||0)},0)}
function cohort(pr,stu){
  var ev=stu.map(function(s){return {s:s,e:evalStu(pr,s.scores),n:s.n}});
  var done=ev.filter(function(x){return x.e.complete});
  var ids=pr.plos.map(function(p){return p.id});
  var per=pr.plos.map(function(p,i){
    var v=done.map(function(x){return x.e.rows[i].pct});
    var mean=v.length?v.reduce(function(a,b){return a+b},0)/v.length:null;
    var pass=v.length?v.filter(function(z){return z>=pr.set.ploPass}).length/v.length*100:null;
    return {p:p,mean:mean,pass:pass,n:v.length};
  });
  var totals=done.map(function(x){return x.e.total});
  var mean=totals.length?totals.reduce(function(a,b){return a+b},0)/totals.length:null;
  var passAll=done.length?done.filter(function(x){return x.e.ok}).length/done.length*100:null;
  var contrib=null;
  if(done.length){var m={};per.forEach(function(x){m[x.p.id]=x.p.weight*(x.mean||0)});contrib=norm100(m,ids)}
  var ais=ev.map(function(x){return x.s.ai}).filter(function(a){return a&&a.shares});
  var aiAvg=null;
  if(ais.length){var m2={};ids.forEach(function(id){m2[id]=ais.reduce(function(s,a){return s+(a.shares[id]||0)},0)/ais.length});aiAvg=norm100(m2,ids)}
  var ws=weightShare(pr);
  var onTarget=per.filter(function(x){return x.pass!=null&&x.pass>=pr.set.target}).length;
  return {ev:ev,done:done,per:per,mean:mean,passAll:passAll,contrib:contrib,aiAvg:aiAvg,aiN:ais.length,ws:ws,ids:ids,onTarget:onTarget,
    align:aiAvg&&ws?overlap(aiAvg,ws,ids):null,
    index:done.length?0.4*mean+0.3*passAll+0.3*(onTarget/pr.plos.length*100):null};
}
function progStudents(){
  return G.P.students.map(function(s){var ev=evalsOf(s.id);return {id:s.id,code:s.code,name:s.name,topic:s.topic,advisor:s.advisor,sample:s.sample,scores:meanOf(ev),ai:G.P.ai[s.id]||null,n:ev.filter(function(x){return Object.keys(x.scores).length}).length}});
}
function status(pass,tgt){
  if(pass==null)return {c:"na",t:"ยังไม่มีข้อมูล",i:"–"};
  if(pass>=tgt)return {c:"good",t:"บรรลุเป้า",i:"✓"};
  if(pass>=tgt-15)return {c:"warn",t:"เฝ้าระวัง",i:"!"};
  return {c:"bad",t:"ต้องปรับปรุง",i:"✕"};
}
function chip(s){return '<span class="chip '+s.c+'"><span aria-hidden="true">'+s.i+'</span>'+s.t+'</span>'}
function progStatus(n){return n?'<span class="chip good">มี PLO '+n+' ข้อ</span>':'<span class="chip na">รอนำเข้า PLO</span>'}

/* ---------- charts ---------- */
function radar(axes,series){
  var W=380,H=330,cx=190,cy=165,R=105,n=axes.length;
  function pt(i,v){var a=-Math.PI/2+2*Math.PI*i/n,r=R*v/100;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
  var g="";
  [25,50,75,100].forEach(function(v){g+='<polygon points="'+axes.map(function(_,i){return pt(i,v).map(function(z){return z.toFixed(1)}).join(",")}).join(" ")+'" fill="none" stroke="var(--grid)" stroke-width="1"/>'});
  axes.forEach(function(a,i){
    var e=pt(i,100);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--grid)"/>';
    var a2=-Math.PI/2+2*Math.PI*i/n,lx=cx+(R+16)*Math.cos(a2),ly=cy+(R+16)*Math.sin(a2),c=Math.cos(a2);
    g+='<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="'+(c>0.25?"start":(c<-0.25?"end":"middle"))+'">'+esc(a.label)+'</text>';
  });
  [50,100].forEach(function(v){g+='<text class="m" x="'+(cx+4)+'" y="'+(cy-R*v/100-2)+'">'+v+'</text>'});
  series.forEach(function(s){
    var pts=s.vals.map(function(v,i){return pt(i,v==null?0:v).map(function(z){return z.toFixed(1)}).join(",")}).join(" ");
    g+='<polygon points="'+pts+'" fill="'+(s.fill?s.color:"none")+'" fill-opacity="'+(s.fill?0.16:0)+'" stroke="'+s.color+'" stroke-width="'+(s.dash?1.75:2.5)+'"'+(s.dash?' stroke-dasharray="5 4"':"")+' stroke-linejoin="round"/>';
    if(s.marks)s.vals.forEach(function(v,i){var p=pt(i,v==null?0:v);g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="'+s.color+'" stroke="var(--surface)" stroke-width="2"><title>'+esc(axes[i].tip)+' · '+esc(s.name)+': '+fmt(v)+'%</title></circle>'});
  });
  var leg=series.map(function(s){return '<span><i class="'+(s.dash?"dash":"")+'" style="border-color:'+s.color+'"></i>'+esc(s.name)+'</span>'}).join("");
  return '<svg class="radar" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="กราฟใยแมงมุมเทียบ PLO">'+g+'</svg><div class="legend">'+leg+'</div>';
}
function axesOf(pr){return pr.plos.map(function(p){return {label:p.code,tip:p.code+" "+p.th}})}
function thresholdSeries(pr){return {name:"เกณฑ์ผ่าน PLO ("+pr.set.ploPass+"%)",vals:pr.plos.map(function(){return pr.set.ploPass}),color:"var(--muted)",dash:true}}
function stackBar(pr,map,label){
  if(!map)return '<div class="stk-l">'+esc(label)+'</div><div class="stk-l" style="margin-bottom:10px">ยังไม่มีข้อมูล</div>';
  var segs="",other=0;
  pr.plos.forEach(function(p,i){
    var v=map[p.id]||0;if(!v)return;
    if(i>=7){other+=v;return}
    segs+='<div class="'+(i>=2&&i<=4?"dk":"")+'" style="width:'+v+'%;background:var(--c'+(i+1)+')" title="'+esc(p.code+" "+p.th+": "+v+"%")+'">'+(v>=7?esc(p.code.replace("PLO",""))+" · "+v:"")+'</div>';
  });
  if(other)segs+='<div style="width:'+other+'%;background:var(--cx)" title="อื่น ๆ: '+other+'%">'+(other>=7?"อื่น ๆ · "+other:"")+'</div>';
  return '<div class="stk-l">'+esc(label)+'</div><div class="stk" role="img" aria-label="'+esc(label)+'">'+segs+'</div>';
}
function stackLegend(pr){
  return '<div class="legend">'+pr.plos.slice(0,7).map(function(p,i){return '<span><i class="sw" style="color:var(--c'+(i+1)+')"></i>'+esc(p.code)+' '+esc(p.th)+'</span>'}).join("")+(pr.plos.length>7?'<span><i class="sw" style="color:var(--cx)"></i>อื่น ๆ</span>':"")+'</div>';
}

/* ============================================================
 * หน้าบ้าน: เลือกส่วนงาน → หลักสูตร
 * ============================================================ */
function viewHome(){
  var f=G.boot.faculties,q=G.q.trim().toLowerCase();
  var list=f.filter(function(x){return !q||x.name.toLowerCase().indexOf(q)>=0||x.programs.some(function(p){return p.name.toLowerCase().indexOf(q)>=0})});
  var h='<div class="hero"><h1>เลือกส่วนงาน</h1><p>เลือกส่วนงานแล้วเลือกหลักสูตร แต่ละหลักสูตรมี PLO ของตัวเองเป็นตัวชี้วัดสำหรับประเมินนักศึกษา</p>'+
    '<input type="search" id="q" class="search" placeholder="ค้นหาส่วนงานหรือหลักสูตร" aria-label="ค้นหา" value="'+esc(G.q)+'"></div>';
  h+='<div class="cards">';
  list.forEach(function(x){
    var ready=x.programs.filter(function(p){return p.ploCount>0}).length,sc=x.programs.reduce(function(a,p){return a+p.studentCount},0);

      '<div class="meta"><span>มี PLO แล้ว '+ready+'/'+x.programs.length+'</span><span>นักศึกษา '+sc+' คน</span></div></button>';
  });
  h+='</div>';
  if(!list.length)h+='<div class="empty">'+(f.length?'ไม่พบส่วนงานที่ตรงกับคำค้น':'ยังไม่มีส่วนงาน'+(canEdit()?' เพิ่มได้ที่ "จัดการระบบ"':""))+'</div>';
  h+='<div class="row" style="margin-top:20px"><button class="btn" data-act="cross">เทียบ PLO ข้ามหลักสูตร</button></div>';
  return h;
}
function viewFaculty(){
  var fac=facOf(G.facId);
  if(!fac)return '<div class="empty">ไม่พบส่วนงาน</div>';
  var h='<div class="hero"><h1>'+esc(fac.name)+'</h1><p>เลือกหลักสูตรเพื่อประเมินนักศึกษาและดูผลตาม PLO</p></div><div class="cards">';
  fac.programs.forEach(function(p){
    h+='<button class="pick" data-act="prog" data-id="'+esc(p.id)+'"><h3>'+esc(p.name)+'</h3><div class="row">'+progStatus(p.ploCount)+(p.level?'<span class="muted" style="font-size:12px">'+esc(p.level)+'</span>':"")+'</div>'+
      '<div class="meta"><span>นักศึกษา '+p.studentCount+' คน</span></div></button>';
  });
  h+='</div>';
  if(!fac.programs.length)h+='<div class="empty">ส่วนงานนี้ยังไม่มีหลักสูตร'+(canEdit()?' <button class="btn sm" data-act="adminhome">ไปเพิ่มที่ จัดการระบบ</button>':"")+'</div>';
  return h;
}

/* ============================================================
 * หน้าบ้าน: ภาพรวมหลักสูตร (ผู้บริหาร)
 * ============================================================ */
function emptyPlo(){
  return '<div class="card"><div class="empty"><h2 style="margin-bottom:6px">หลักสูตรนี้ยังไม่มี PLO</h2><p>ต้องนำเข้า PLO จากเล่มหลักสูตรก่อน ระบบจึงสร้างเกณฑ์ประเมินให้ได้</p>'+
    (canCurr()?'<button class="btn primary" data-act="adminplo">ไปนำเข้า PLO (จัดการข้อมูลหลักสูตร)</button>':'<p>แจ้งผู้ดูแลระบบให้นำเข้า PLO ของหลักสูตรนี้</p>')+'</div></div>';
}
function viewExec(){
  var pr=G.P,C=cohort(pr,progStudents()),t=pr.set.target;
  if(!pr.plos.length)return emptyPlo();
  var low=C.per.filter(function(x){return x.pass!=null}).sort(function(a,b){return a.pass-b.pass});
  var below=C.per.filter(function(x){return x.pass!=null&&x.pass<t}).length;
  var h='<div class="kpis">'+
    '<div class="kpi"><div class="l">นักศึกษาที่ประเมินครบ</div><div class="v">'+C.done.length+'<small> / '+C.ev.length+' คน</small></div><div class="s">ที่เหลือยังกรอกไม่ครบ</div></div>'+
    '<div class="kpi"><div class="l">ผ่านเกณฑ์โดยรวม</div><div class="v">'+fmt(C.passAll)+'<small>%</small></div><div class="s">คะแนนรวม ≥ '+pr.set.overall+' และผ่าน PLO ≥ '+pr.set.fraction+'% ของทั้งหมด</div></div>'+
    '<div class="kpi"><div class="l">คะแนนเฉลี่ยรุ่น (เต็ม 100)</div><div class="v">'+(C.mean==null?"–":C.mean.toFixed(1))+'</div><div class="s">ถ่วงน้ำหนักตาม PLO</div></div>'+
    '<div class="kpi"><div class="l">PLO ต่ำกว่าเป้า '+t+'%</div><div class="v">'+below+'<small> / '+pr.plos.length+'</small></div><div class="s">เป้า = สัดส่วนนักศึกษาที่ผ่าน PLO นั้น</div></div>'+
    '<div class="kpi"><div class="l">สอดคล้องกับการออกแบบหลักสูตร</div><div class="v">'+fmt(C.align)+'<small>%</small></div><div class="s">'+(C.align==null?'ต้องให้ AI วิเคราะห์ความเห็นอย่างน้อย 1 คนก่อน':'จากความเห็นอาจารย์ '+C.aiN+' คน (100 = ตรงเป๊ะ)')+'</div></div>'+'</div>';

  C.per.forEach(function(x){

function me(){return G.me.email}
function myEval(sid){
  var e=G.P.evals.find(function(x){return x.studentId===sid&&x.email===me()});
  if(!e){e={studentId:sid,email:me(),name:G.me.name,scores:{},comment:"",updatedAt:""};G.P.evals.push(e)}
  return e;
}
function stu(){return G.P.students.find(function(s){return s.id===G.stuId})||G.P.students[0]||null}
function totalCrit(pr){return pr.plos.reduce(function(a,p){return a+p.crit.length},0)}
function myProgress(pr,sid){
  var e=G.P.evals.find(function(x){return x.studentId===sid&&x.email===me()});
  var n=e?Object.keys(e.scores).length:0,t=totalCrit(pr);
  if(n>=t&&t>0)return '<span class="chip good">✓ ครบ</span>';
  if(n>0)return '<span class="chip warn">'+n+'/'+t+'</span>';
  return '<span class="chip na">ยังไม่ประเมิน</span>';
}
function studentList(pr){
  var q=G.lq.trim().toLowerCase(),sel=stu();
  var list=pr.students.filter(function(s){return !q||(s.name+" "+s.code+" "+s.topic).toLowerCase().indexOf(q)>=0});
  var h='<aside class="slist"><div class="plo-head"><b>นักศึกษา ('+pr.students.length+')</b>'+(canCurr()?'<button class="btn sm" data-act="toggleadd">'+(G.showAdd?"ปิด":"+ เพิ่ม")+'</button>':"")+'</div>'+
    '<input type="search" id="lq" placeholder="ค้นหาชื่อ รหัส หรือหัวข้อ" aria-label="ค้นหานักศึกษา" value="'+esc(G.lq)+'">';
  if(G.showAdd)h+=addStuForm();
  list.forEach(function(s){
    h+='<button class="sitem" data-act="pickstu" data-id="'+esc(s.id)+'" aria-current="'+(sel&&s.id===sel.id)+'"><div class="row"><b>'+esc(s.name)+'</b>'+(canScore()?myProgress(pr,s.id):"")+'</div><small>'+(s.code?esc(s.code)+' · ':"")+esc(s.topic)+'</small></button>';

  return h+'</aside>';
}

      h+='<div class="crit-card" data-crit="'+esc(c.id)+'" data-done="'+(has?1:0)+'"><div class="crit-name">'+esc(c.name)+(om?'<small>กรรมการอื่น เฉลี่ย '+om+'/10 ('+ov.length+' คน)</small>':"")+'</div><div class="bands" role="group" aria-label="คะแนนของ '+esc(c.name)+'">';

  });
  h+='<div class="sticky-bar"><div><b>'+myc+'/'+tot2+'</b> เกณฑ์<div class="prog" style="margin:3px 0 0;width:120px"><i style="width:'+(tot2?myc/tot2*100:0)+'%"></i></div></div><div class="sb-score">รวม <b>'+(e.total==null?"–":e.total.toFixed(1))+'</b></div><div class="row" style="flex-wrap:nowrap">'+(myc<tot2&&!ro?'<button class="btn sm" data-act="nextunscored">ข้อที่ยังไม่ให้</button>':"")+(idx<pr.students.length-1?'<button class="btn primary sm" data-act="stunext">คนถัดไป ›</button>':"")+'</div></div>';

function insights(pr,e){
  var sc=e.rows.filter(function(r){return r.pct!=null}).sort(function(a,b){return b.pct-a.pct});
  if(!sc.length)return '<p class="muted">เลือกระดับในตารางเพื่อดูจุดแข็งและจุดที่ควรพัฒนา</p>';
  var top=sc.slice(0,2),bot=sc.filter(function(r){return r.pct<pr.set.ploPass});
  if(!bot.length)bot=sc.slice(-1);
  return '<div class="insight"><b>จุดแข็ง:</b> '+top.map(function(r){return esc(r.p.code)+' ('+ten(r.pct)+'/10)'}).join(", ")+'</div>'+
    '<div class="insight"><b>'+(bot[0].pct<pr.set.ploPass?"ควรปรับปรุง:":"ต่ำสุด:")+'</b> '+bot.map(function(r){return esc(r.p.code)+' ('+ten(r.pct)+'/10)'}).join(", ")+'</div>';

function aiBody(pr,a,ids){
  var ws=weightShare(pr),h=stackBar(pr,a.shares,"สิ่งที่ความเห็นพูดถึง (รวม 100%)")+stackBar(pr,ws,"น้ำหนักที่หลักสูตรออกแบบ (รวม 100%)")+stackLegend(pr);

  if(a.summary)h+='<div class="insight">'+esc(a.summary)+'</div>';
  if(a.flags&&a.flags.length)h+='<div style="margin-top:8px"><b style="font-size:13px">ข้อสังเกตจาก AI</b>'+a.flags.map(function(f){var p=pr.plos.find(function(x){return x.id===f.plo});return '<div class="pair"><span class="chip warn">! '+esc(f.type)+'</span> <b>'+esc(p?p.code:f.plo)+'</b> '+esc(f.note)+'</div>'}).join("")+'</div>';
  var evd=pr.plos.filter(function(p){return a.evidence&&a.evidence[p.id]&&a.evidence[p.id].length});
  if(evd.length)h+='<details style="margin-top:8px"><summary class="muted" style="cursor:pointer">คำพูดที่ AI ใช้เป็นหลักฐาน</summary>'+evd.map(function(p){return '<div class="pair"><b>'+esc(p.code)+' ('+(a.shares[p.id]||0)+'%)</b><div class="ev">'+a.evidence[p.id].map(function(q){return '<q>“'+esc(q)+'”</q>'}).join("")+'</div></div>'}).join("")+'</details>';
  return h+'<div class="muted" style="font-size:11px;margin-top:8px">วิเคราะห์โดย AI เมื่อ '+new Date(a.at).toLocaleString("th-TH")+' ใช้ประกอบการตัดสินใจ ไม่ใช่ผลสุดท้าย</div>';

var KINDS=[
 ["people","ตารางรายคน","ทั้งหลักสูตร แถวละ 1 คน: รหัส ชื่อ คะแนน PLO แต่ละข้อ คะแนนรวม สถานะ ความเห็น"],
 ["byrater","แยกตามกรรมการ","แถวละ 1 คน ต่อ 1 กรรมการ: คะแนน 0-10 ของทุกเกณฑ์ ความเห็น เวลาบันทึก"],
 ["person","รายงานรายบุคคล","เลือกนักศึกษา 1 คน ได้ใบสรุปผล PLO เกณฑ์ ระดับของกรรมการแต่ละคน และความเห็น"],
 ["share","สัดส่วน PLO รวม 100%","ภาพรวมทั้งรุ่น: ออกแบบ ส่วนร่วมจริง และความเห็นอาจารย์ (AI)"]
];
function critCols(pr){var cols=[];pr.plos.forEach(function(p){p.crit.forEach(function(c){cols.push({p:p,c:c})})});return cols}
function verdict(e){return e.complete?(e.ok?"ผ่าน":"ไม่ผ่าน"):"ยังไม่ครบ"}
function rowsPeople(pr){
  var L=[["รหัสนักศึกษา","ชื่อ-สกุล","หัวข้อวิทยานิพนธ์","อาจารย์ที่ปรึกษา","จำนวนกรรมการ"].concat(pr.plos.map(function(p){return p.code+" (เต็ม 10)"})).concat(["คะแนนรวม (เต็ม 100)","ผ่าน PLO (ข้อ)","สถานะ","PLO ต่ำสุด","ความเห็นกรรมการ"])];
  G.P.students.forEach(function(s){
    var ev=evalsOf(s.id),e=evalStu(pr,meanOf(ev)),low=e.rows.filter(function(r){return r.pct!=null}).sort(function(a,b){return a.pct-b.pct})[0];
    L.push([s.code,s.name,s.topic,s.advisor,ev.filter(function(x){return Object.keys(x.scores).length}).length].concat(e.rows.map(function(r){return r.pct==null?"":+(r.pct/10).toFixed(1)})).concat([e.total==null?"":+e.total.toFixed(1),e.passed+"/"+pr.plos.length,verdict(e),low?low.p.code:"",ev.filter(function(x){return x.comment}).map(function(x){return x.name+": "+x.comment}).join(" | ")]));
  });
  return L;
}
function rowsByRater(pr){
  var cols=critCols(pr),L=[["รหัสนักศึกษา","ชื่อ-สกุล","หัวข้อวิทยานิพนธ์","กรรมการ","อีเมลกรรมการ"].concat(cols.map(function(x){return x.p.code+" · "+x.c.name})).concat(["ความเห็น","บันทึกเมื่อ"])];
  G.P.students.forEach(function(s){
    evalsOf(s.id).forEach(function(e){
      if(!Object.keys(e.scores).length&&!e.comment)return;
      L.push([s.code,s.name,s.topic,e.name,e.email].concat(cols.map(function(x){var v=e.scores[x.c.id];return isNum(v)?v:""})).concat([e.comment,e.updatedAt?new Date(e.updatedAt).toLocaleString("th-TH"):""]));
    });
  });
  return L;
}
function rowsPerson(pr,st){
  if(!st)return [["เลือกนักศึกษา"]];
  var ev=evalsOf(st.id).filter(function(x){return Object.keys(x.scores).length||x.comment}),sc=meanOf(ev),e=evalStu(pr,sc),a=G.P.ai[st.id];
  var L=[["รายงานผลการประเมินรายบุคคล"],["หลักสูตร",pr.name],["นักศึกษา",(st.code?st.code+" ":"")+st.name],["หัวข้อวิทยานิพนธ์",st.topic],["อาจารย์ที่ปรึกษา",st.advisor],["กรรมการที่ประเมิน",ev.map(function(x){return x.name}).join(", ")],["สถานะ",verdict(e)],["คะแนนรวม (เต็ม 100)",e.total==null?"":+e.total.toFixed(1)],[],
    ["PLO","ชื่อ PLO","น้ำหนัก","คะแนน PLO (เต็ม 10)","ช่วง","เกณฑ์ผ่าน (เต็ม 10)","ผล",a?"สัดส่วนที่ความเห็นพูดถึง (%)":""]];
  e.rows.forEach(function(r){var b=r.pct==null?null:BANDS[bandIdx(r.pct/10)];L.push([r.p.code,r.p.th,r.p.weight,r.pct==null?"":+(r.pct/10).toFixed(1),b?b.k+" "+b.n:"",+(pr.set.ploPass/10).toFixed(1),r.pct==null?"":(r.pct>=pr.set.ploPass?"ผ่าน":"ไม่ผ่าน"),a&&a.shares?a.shares[r.p.id]||0:""])});
  L.push([]);
  L.push(["PLO","เกณฑ์","คะแนนเฉลี่ย (เต็ม 10)","ช่วง"].concat(ev.map(function(x){return x.name})));
  critCols(pr).forEach(function(x){var m=sc[x.c.id];L.push([x.p.code,x.c.name,isNum(m)?+m.toFixed(2):"",isNum(m)?BANDS[bandIdx(m)].k:""].concat(ev.map(function(y){var v=y.scores[x.c.id];return isNum(v)?v:""})))});
  L.push([]);L.push(["ความเห็นของกรรมการ"]);
  ev.forEach(function(x){if(x.comment)L.push([x.name,x.comment])});
  if(a&&a.summary){L.push([]);L.push(["สรุปโดย AI",a.summary])}
  return L;
}
function rowsShare(pr){
  var C=cohort(pr,progStudents()),L=[["PLO","ชื่อ PLO","ออกแบบ (%)","ส่วนร่วมต่อคะแนนรวมจริง (%)","ความเห็นอาจารย์โดย AI (%)","ส่วนต่าง (ความเห็น − ออกแบบ)","คะแนนเฉลี่ย PLO (%)","นักศึกษาที่ผ่าน PLO (%)"]];
  pr.plos.forEach(function(p,i){var x=C.per[i];L.push([p.code,p.th,C.ws?C.ws[p.id]:"",C.contrib?C.contrib[p.id]:"",C.aiAvg?C.aiAvg[p.id]:"",C.aiAvg&&C.ws?C.aiAvg[p.id]-C.ws[p.id]:"",x.mean==null?"":+x.mean.toFixed(1),x.pass==null?"":+x.pass.toFixed(1)])});
  L.push(["รวม","",100,C.contrib?100:"",C.aiAvg?100:"","","",""]);
  return L;
}
function exportRows(){
  var pr=G.P,k=G.exp.kind;
  if(k==="byrater")return rowsByRater(pr);
  if(k==="person")return rowsPerson(pr,pr.students.find(function(s){return s.id===G.exp.stu}));
  if(k==="share")return rowsShare(pr);
  return rowsPeople(pr);
}
function csvCell(x){x=String(x==null?"":x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}
function toCsv(L){return L.map(function(r){return r.map(csvCell).join(",")}).join("\n")}

function signal(C,pr){
  if(C.done.length<5)return {c:"na",i:"…",t:"ข้อมูลยังน้อย (ต้องประเมินครบ ≥ 5 คน)"};
  if(C.index>=75&&C.passAll>=80&&C.onTarget===pr.plos.length)return {c:"good",i:"✓",t:"พร้อมพิจารณาขยายรับ"};
  if(C.index>=60&&C.passAll>=60)return {c:"warn",i:"!",t:"คงรับ แล้วปรับ PLO ที่ต่ำ"};
  return {c:"bad",i:"✕",t:"ทบทวนผลลัพธ์ก่อนขยาย"};

function applyField(key,val){
  var pr=G.P,a=key.split(":");
  if(a[0]==="s"){if(a[1]==="name")pr.name=val||pr.name;else pr.set[a[1]]=Math.max(0,Math.min(100,Number(val)||0))}
  else if(a[0]==="p"){var p=pr.plos[+a[1]];if(a[2]==="weight")p.weight=Math.max(0,Number(val)||0);else p[a[2]]=val}
  else if(a[0]==="c"){pr.plos[+a[1]].crit[+a[2]].name=val}
  else if(a[0]==="d"){var c=pr.plos[+a[1]].crit[+a[2]];if(!c.desc)c.desc=BANDS.map(function(b,i){return gen(c.name,i)});while(c.desc.length<BANDS.length)c.desc.push(gen(c.name,c.desc.length));c.desc[+a[3]]=val}
  G.dirty=true;
}

async function draftAll(){
  var pr=G.P;if(!pr||G.busy.all)return;
  if(G.dirty){toast("บันทึกการแก้ไขที่ค้างอยู่ก่อน แล้วค่อยให้ AI ร่างเกณฑ์");return}
  var ok=0,bad=[];
  for(var i=0;i<pr.plos.length;i++){
    var p=pr.plos[i];G.busy.all=(i+1)+"/"+pr.plos.length;renderKeep();
    try{var d=await call("aiDraftRubric",pr.id,p.id);p.crit=d.map(function(x){return {id:rid("c"),name:x.name,desc:x.bands}});ok++;G.dirty=true}
    catch(e){bad.push(p.code+": "+errMsg(e))}
  }
  G.busy.all=null;renderKeep();
  toast("AI ร่างเกณฑ์แล้ว "+ok+"/"+pr.plos.length+" PLO"+(bad.length?" (ไม่สำเร็จ: "+bad.join("; ")+")":"")+" ตรวจแก้แล้วกดบันทึก");
}

/* ---------- roster parsing ---------- */
function splitLine(line,d){
  var out=[],cur="",q=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===d){out.push(cur);cur=""}else cur+=ch;
  }
  out.push(cur);return out.map(function(x){return x.trim()});
}
function parseRoster(text){
  var lines=String(text||"").split(/\r?\n/).filter(function(l){return l.trim()});
  if(!lines.length)return [];
  var d=lines.some(function(l){return l.indexOf("\t")>=0})?"\t":",";
  var rows=lines.map(function(l){return splitLine(l,d)});
  var h=rows[0].map(function(x){return x.toLowerCase()});
  function find(keys){for(var i=0;i<h.length;i++){if(keys.some(function(k){return h[i].indexOf(k)>=0}))return i}return -1}
  var map=null,iC=find(["รหัส","code","student id","studentid"]),iN=find(["ชื่อ","name"]),iT=find(["หัวข้อ","topic","thesis"]),iA=find(["ที่ปรึกษา","advisor","adviser"]);
  if(iN>=0&&(iC>=0||iT>=0||iA>=0||h.length===1)){map={code:iC,name:iN,topic:iT,advisor:iA};rows=rows.slice(1)}
  else if(/^[A-Za-z]{0,3}\d{5,}$/.test(rows[0][0]||""))map={code:0,name:1,topic:2,advisor:3};
  else map={code:-1,name:0,topic:1,advisor:2};
  return rows.map(function(r){
    function g(i){return i>=0&&r[i]!==undefined?r[i]:""}
    return {code:g(map.code),name:g(map.name),topic:g(map.topic),advisor:g(map.advisor)};
  }).filter(function(x){return x.name});
}

/* ---------- scoring save (debounced) ---------- */
var saveT={};
function queueSave(sid){
  var ss=$("savestate");if(ss)ss.textContent="กำลังบันทึก…";
  clearTimeout(saveT[sid]);
  saveT[sid]=setTimeout(async function(){
    var e=myEval(sid);
    try{await call("saveEval",G.P.id,sid,e.scores,e.comment);var s2=$("savestate");if(s2)s2.textContent="บันทึกแล้ว"}
    catch(err){var s3=$("savestate");if(s3)s3.textContent="บันทึกไม่สำเร็จ";fail(err)}
  },600);
}

    render();
  }catch(e){$("app").innerHTML='<div class="card empty"><h2>เปิดระบบไม่สำเร็จ</h2><p>'+esc(errMsg(e))+'</p><p>ถ้าเพิ่งติดตั้ง ให้รันฟังก์ชัน setup() ใน Apps Script หนึ่งครั้งก่อน</p></div>'}
})();
})();
</script></body></html>
