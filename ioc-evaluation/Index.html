<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แบบประเมิน IOC</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
      --brand: #1d4ed8; --brand-ink: #ffffff; --brand-soft: #dbeafe;
      --pos: #15803d; --pos-soft: #dcfce7; --mid: #b45309; --mid-soft: #fef3c7; --neg: #b91c1c; --neg-soft: #fee2e2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Sarabun', Tahoma, sans-serif; background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.6; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
    header.hero { background: linear-gradient(135deg, #1e3a8a, #1d4ed8 60%, #0ea5e9); color: #fff; padding: 28px 0 56px; }
    header.hero small { opacity: .85; font-size: 14px; }
    header.hero h1 { margin: 4px 0 6px; font-size: 24px; line-height: 1.35; }
    header.hero p { margin: 0; opacity: .92; }
    .card { background: var(--card); border-radius: 16px; box-shadow: 0 1px 3px rgb(15 23 42 / .08); padding: 20px; margin-bottom: 16px; }
    .lift { margin-top: -40px; }
    .legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .legend div { border-radius: 12px; padding: 10px; font-size: 14px; }
    .legend b { display: block; font-size: 18px; }
    .l-pos { background: var(--pos-soft); color: var(--pos); } .l-mid { background: var(--mid-soft); color: var(--mid); } .l-neg { background: var(--neg-soft); color: var(--neg); }
    label.f { display: block; font-weight: 600; font-size: 14px; margin: 10px 0 4px; }
    input[type=text], textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; color: var(--ink); }
    input[type=text]:focus, textarea:focus { outline: 2px solid var(--brand); border-color: transparent; }
    textarea { min-height: 72px; resize: vertical; }

    /* แถบความคืบหน้า */
    .progress { position: sticky; top: 0; z-index: 20; background: rgb(255 255 255 / .96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
    .progress .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
    .bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--pos); transition: width .25s; }
    .count { font-weight: 700; font-size: 14px; white-space: nowrap; }
    .btn-ghost { font: inherit; font-size: 13px; border: 1px solid var(--line); background: #fff; color: var(--brand); border-radius: 99px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }

    /* ส่วน/มิติ */
    .sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 28px 0 10px; flex-wrap: wrap; }
    .sec-head small { color: var(--brand); font-weight: 600; }
    .sec-head h2 { margin: 0; font-size: 20px; line-height: 1.3; }
    .sec-head h2 span { color: var(--muted); font-weight: 500; font-size: 16px; }
    .link { background: none; border: 0; color: var(--brand); font: inherit; font-size: 14px; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

    /* ข้อคำถาม */
    .item { padding: 16px 20px; border-left: 4px solid transparent; transition: border-color .2s, box-shadow .2s; }
    .item.done { border-left-color: var(--pos); }
    .item.missing { border-left-color: var(--neg); box-shadow: 0 0 0 2px var(--neg-soft); }
    .q { display: flex; gap: 12px; }
    .no { flex: none; min-width: 40px; height: 28px; padding: 0 8px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); font-weight: 700; display: grid; place-items: center; font-size: 14px; }
    .q p { margin: 0; font-weight: 500; }
    .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .opts span { font-size: 13px; color: var(--muted); border: 1px dashed #cbd5e1; border-radius: 99px; padding: 1px 10px; }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg label { display: flex; flex-direction: column; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 4px; cursor: pointer; user-select: none; transition: all .15s; background: #fff; }
    .seg label b { font-size: 18px; line-height: 1.2; }
    .seg label span { font-size: 12.5px; color: var(--muted); }
    .seg label:hover { border-color: #94a3b8; }
    .seg input:focus-visible + label { outline: 2px solid var(--brand); outline-offset: 2px; }
    .seg input[value="1"]:checked + label  { background: var(--pos); border-color: var(--pos); color: #fff; }
    .seg input[value="0"]:checked + label  { background: var(--mid); border-color: var(--mid); color: #fff; }
    .seg input[value="-1"]:checked + label { background: var(--neg); border-color: var(--neg); color: #fff; }
    .seg input:checked + label span { color: rgb(255 255 255 / .9); }
    .note-toggle { margin-top: 8px; }
    .note { margin-top: 8px; display: none; }
    .note.open { display: block; }
    .hint { font-size: 13px; color: var(--mid); margin-top: 4px; }

    .confirm { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; cursor: pointer; }
    .confirm input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--brand); }
    .submit { width: 100%; font: inherit; font-size: 18px; font-weight: 700; padding: 14px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); cursor: pointer; margin-top: 16px; }
    .submit:disabled { opacity: .6; cursor: wait; }
    .err { color: var(--neg); font-size: 14px; margin-top: 8px; }
    .saved { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; }

    .center { text-align: center; padding: 40px 20px; }
    .big { font-size: 56px; line-height: 1; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
    .stats div { border-radius: 12px; padding: 12px; }
    .stats b { display: block; font-size: 26px; }
    .skeleton { height: 90px; border-radius: 16px; background: linear-gradient(90deg, #e2e8f0, #f8fafc, #e2e8f0); background-size: 200% 100%; animation: sh 1.2s infinite; margin-bottom: 12px; }
    @keyframes sh { to { background-position: -200% 0; } }
    .toast { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 520px; margin: 0 auto; background: #0f172a; color: #fff; padding: 12px 16px; border-radius: 12px; z-index: 50; display: none; }
    footer { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0 40px; }
    @media (max-width: 480px) {
      header.hero h1 { font-size: 20px; }
      .card, .item { padding: 16px; }
      .seg label span { font-size: 11.5px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <small>สำหรับผู้เชี่ยวชาญ</small>
      <h1 id="title">แบบประเมินความสอดคล้องของข้อคำถาม (IOC)</h1>
      <p id="subtitle"></p>
    </div>
  </header>

  <div class="progress" id="progress" hidden>
    <div class="wrap">
      <span class="count" id="count">0/0</span>
      <div class="bar"><i id="barFill"></i></div>
      <button class="btn-ghost" id="jumpBtn" type="button">ข้อที่ยังไม่ตอบ ↓</button>
    </div>
  </div>

  <main class="wrap" id="app">
    <div class="lift">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </main>

  <footer class="wrap">คำตอบของท่านบันทึกเป็นฉบับร่างในเครื่องนี้อัตโนมัติ · ส่งแล้วสามารถเปิดลิงก์เดิมเพื่อแก้ไขได้</footer>
  <div class="toast" id="toast" role="status"></div>

<script>
  const TOKEN = <?!= JSON.stringify(token) ?>;
  const DRAFT_KEY = 'ioc-draft-' + (TOKEN || 'open');
  const LABELS = { '1': ['+1', 'สอดคล้อง'], '0': ['0', 'ไม่แน่ใจ'], '-1': ['−1', 'ไม่สอดคล้อง'] };
  let FORM = null;

  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  function toast(msg, ms) {
    const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms || 3000);
  }

  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(e => { $('#app').innerHTML = '<div class="card lift center"><div class="big">⚠️</div><p>' + esc(e.message) + '</p></div>'; })
    .getFormData(TOKEN);

  function render(data) {
    FORM = data;
    $('#title').textContent = data.title;
    $('#subtitle').textContent = data.subtitle;

    if (data.requireToken && !data.tokenValid) {
      $('#app').innerHTML = '<div class="card lift center"><div class="big">🔒</div><h2>ลิงก์ไม่ถูกต้อง</h2><p>กรุณาเปิดจากลิงก์ส่วนตัวในอีเมลที่ได้รับ</p></div>';
      return;
    }

    const ex = data.expert || {};
    let html = '<div class="card lift">' +
      (data.tokenGiven && !data.tokenValid ? '<p class="err">ไม่พบรหัสลิงก์นี้ในรายชื่อ — กรุณากรอกชื่อของท่านด้านล่าง</p>' : '') +
      (data.previous ? '<p class="hint">ท่านเคยส่งแบบประเมินแล้ว — แก้ไขคำตอบด้านล่างแล้วกดส่งอีกครั้งได้</p>' : '') +
      '<b>คำชี้แจง</b><p style="margin:4px 0 0">โปรดพิจารณาความสอดคล้องระหว่างข้อคำถามกับนิยาม/มิติคุณภาพการบริการ (SERVQUAL) ' +
      'โดยเลือกระดับความคิดเห็นของท่าน พร้อมระบุข้อเสนอแนะ (ถ้ามี)</p>' +
      '<div class="legend"><div class="l-pos"><b>+1</b>สอดคล้อง</div><div class="l-mid"><b>0</b>ไม่แน่ใจ</div><div class="l-neg"><b>−1</b>ไม่สอดคล้อง</div></div>' +
      (data.deadline ? '<p class="hint" style="color:var(--muted)">กำหนดส่ง: ' + esc(data.deadline) + '</p>' : '') +
      '<label class="f" for="name">ชื่อ-นามสกุล ผู้ประเมิน *</label><input type="text" id="name" autocomplete="name" value="' + esc(ex.name) + '">' +
      '<label class="f" for="position">ตำแหน่ง/สังกัด</label><input type="text" id="position" autocomplete="organization-title" value="' + esc(ex.position) + '">' +
      '</div>';

    data.sections.forEach(sec => {
      html += '<section data-sec="' + esc(sec.id) + '"><div class="sec-head"><div><small>' + esc(sec.part) + '</small>' +
        '<h2>' + esc(sec.title) + ' <span>' + esc(sec.subtitle) + '</span></h2></div>' +
        '<button type="button" class="link" data-all="' + esc(sec.id) + '">ให้ +1 ทุกข้อที่ยังไม่ตอบในส่วนนี้</button></div>';
      sec.items.forEach(it => {
        const name = 's_' + it.code;
        html += '<div class="card item" id="item-' + esc(it.code) + '" data-code="' + esc(it.code) + '">' +
          '<div class="q"><div class="no">' + esc(it.no) + '</div><div><p>' + esc(it.text) + '</p>' +
          (it.options ? '<div class="opts">' + it.options.map(o => '<span>◯ ' + esc(o) + '</span>').join('') + '</div>' : '') +
          '</div></div>' +
          '<div class="seg" role="radiogroup" aria-label="ระดับความสอดคล้อง ข้อ ' + esc(it.no) + '">' +
          ['1', '0', '-1'].map(v => {
            const id = name + '_' + v.replace('-', 'm');
            return '<input type="radio" name="' + esc(name) + '" id="' + esc(id) + '" value="' + v + '">' +
              '<label for="' + esc(id) + '"><b>' + LABELS[v][0] + '</b><span>' + LABELS[v][1] + '</span></label>';
          }).join('') + '</div>' +
          '<button type="button" class="link note-toggle">💬 ข้อเสนอแนะ</button>' +
          '<div class="note"><textarea data-note="' + esc(it.code) + '" placeholder="ข้อเสนอแนะ / แนวทางปรับปรุงข้อคำถาม (ถ้ามี)"></textarea></div>' +
          '</div>';
      });
      html += '</section>';
    });

    html += '<div class="card" style="margin-top:28px">' +
      '<label class="f" for="overall" style="margin-top:0">ข้อเสนอแนะเพิ่มเติมจากผู้เชี่ยวชาญ</label>' +
      '<textarea id="overall" placeholder="ข้อเสนอแนะต่อแบบสอบถามโดยรวม (ถ้ามี)"></textarea>' +
      '<label class="confirm"><input type="checkbox" id="confirm"><span>ข้าพเจ้าได้พิจารณาข้อคำถามทุกข้อ และยืนยันผลการประเมินนี้ (แทนการลงชื่อ)</span></label>' +
      '<button class="submit" id="submitBtn" type="button">ส่งแบบประเมิน</button>' +
      '<div class="err" id="err"></div><div class="saved" id="saved"></div></div>';

    $('#app').innerHTML = html;
    $('#progress').hidden = false;

    // คำตอบเดิม (จากชีต) หรือฉบับร่างในเครื่อง
    const draft = readDraft();
    const prev = draft || data.previous;
    if (prev) fill(prev);
    if (draft) $('#saved').textContent = 'กู้คืนฉบับร่างที่ยังไม่ได้ส่งแล้ว';
    bind();
    update();
  }

  function fill(a) {
    if (a.name && !$('#name').value) $('#name').value = a.name;
    if (a.position && !$('#position').value) $('#position').value = a.position;
    Object.keys(a.scores || {}).forEach(code => {
      const el = document.querySelector('input[name="s_' + CSS.escape(code) + '"][value="' + a.scores[code] + '"]');
      if (el) el.checked = true;
    });
    Object.keys(a.comments || {}).forEach(code => {
      const ta = document.querySelector('textarea[data-note="' + CSS.escape(code) + '"]');
      if (ta && a.comments[code]) { ta.value = a.comments[code]; ta.parentElement.classList.add('open'); }
    });
    if (a.overall) $('#overall').value = a.overall;
  }

  function bind() {
    $('#app').addEventListener('change', e => {
      if (e.target.type === 'radio') {
        const item = e.target.closest('.item');
        item.classList.remove('missing');
        // เลือก 0 หรือ −1 → เปิดช่องข้อเสนอแนะให้อัตโนมัติ
        if (e.target.value !== '1') {
          const note = $('.note', item); note.classList.add('open');
          if (!$('.hint', item)) note.insertAdjacentHTML('beforeend', '<div class="hint">ช่วยระบุเหตุผลหรือแนวทางปรับปรุง เพื่อให้ผู้วิจัยแก้ไขข้อคำถามได้ตรงจุด</div>');
        }
        update();
        saveDraft();
      }
    });
    $('#app').addEventListener('input', e => { if (e.target.type !== 'radio') saveDraft(); });
    $('#app').addEventListener('click', e => {
      const t = e.target.closest('button');
      if (!t) return;
      if (t.classList.contains('note-toggle')) {
        const note = $('.note', t.closest('.item'));
        note.classList.toggle('open');
        if (note.classList.contains('open')) $('textarea', note).focus();
      } else if (t.dataset.all) {
        let n = 0;
        $$('section[data-sec="' + CSS.escape(t.dataset.all) + '"] .item').forEach(item => {
          if (!$('input:checked', item)) { $('input[value="1"]', item).checked = true; item.classList.remove('missing'); n++; }
        });
        update();
        saveDraft();
        toast(n ? 'ให้ +1 แล้ว ' + n + ' ข้อ — ปรับข้อที่ไม่เห็นด้วยได้' : 'ทุกข้อในส่วนนี้ตอบแล้ว');
      } else if (t.id === 'submitBtn') {
        submit();
      }
    });
    $('#jumpBtn').addEventListener('click', jumpToMissing);
  }

  function answers() {
    const scores = {}, comments = {};
    $$('.item').forEach(item => {
      const code = item.dataset.code, c = $('input:checked', item);
      if (c) scores[code] = Number(c.value);
      const note = $('textarea', item).value.trim();
      if (note) comments[code] = note;
    });
    return { token: TOKEN, name: $('#name').value.trim(), position: $('#position').value.trim(), scores, comments, overall: $('#overall').value.trim() };
  }

  function update() {
    const items = $$('.item');
    let done = 0;
    items.forEach(item => { const ok = !!$('input:checked', item); item.classList.toggle('done', ok); if (ok) done++; });
    $('#count').textContent = 'ตอบแล้ว ' + done + '/' + items.length;
    $('#barFill').style.width = (items.length ? done / items.length * 100 : 0) + '%';
    $('#jumpBtn').style.display = done === items.length ? 'none' : '';
  }

  function jumpToMissing() {
    const m = $$('.item').find(item => !$('input:checked', item));
    if (m) { m.classList.add('missing'); m.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }

  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(answers())); } catch (e) {}
  }
  function readDraft() {
    try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); return d && Object.keys(d.scores || {}).length ? d : null; } catch (e) { return null; }
  }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  function submit() {
    const a = answers(), err = $('#err');
    err.textContent = '';
    if (!a.name) { err.textContent = 'กรุณากรอกชื่อ-นามสกุล ผู้ประเมิน'; $('#name').focus(); $('#name').scrollIntoView({ block: 'center' }); return; }
    const missing = $$('.item').filter(item => !$('input:checked', item));
    if (missing.length) {
      missing.forEach(m => m.classList.add('missing'));
      err.textContent = 'ยังไม่ได้ประเมิน ' + missing.length + ' ข้อ (ข้อ ' + missing.map(m => $('.no', m).textContent).join(', ') + ')';
      jumpToMissing();
      return;
    }
    if (!$('#confirm').checked) { err.textContent = 'กรุณาติ๊กยืนยันผลการประเมินก่อนส่ง'; return; }

    const btn = $('#submitBtn');
    btn.disabled = true; btn.textContent = 'กำลังส่ง…';
    google.script.run
      .withSuccessHandler(r => { clearDraft(); thanks(a, r); })
      .withFailureHandler(e => { btn.disabled = false; btn.textContent = 'ส่งแบบประเมิน'; err.textContent = e.message; })
      .submitEvaluation(a);
  }

  function thanks(a, r) {
    const vals = Object.values(a.scores);
    const c = v => vals.filter(x => x === v).length;
    $('#progress').hidden = true;
    $('#app').innerHTML = '<div class="card lift center"><div class="big">✅</div>' +
      '<h2>' + (r.updated ? 'บันทึกการแก้ไขเรียบร้อย' : 'ส่งแบบประเมินเรียบร้อย') + '</h2>' +
      '<p>ขอขอบพระคุณ ' + esc(a.name) + ' ที่กรุณาสละเวลาพิจารณาข้อคำถาม</p>' +
      '<div class="stats"><div class="l-pos"><b>' + c(1) + '</b>สอดคล้อง (+1)</div><div class="l-mid"><b>' + c(0) + '</b>ไม่แน่ใจ (0)</div>' +
      '<div class="l-neg"><b>' + c(-1) + '</b>ไม่สอดคล้อง (−1)</div></div>' +
      (TOKEN ? '<p class="hint" style="color:var(--muted)">หากต้องการแก้ไข เปิดลิงก์เดิมจากอีเมลได้ทุกเมื่อ</p>' : '') + '</div>';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
