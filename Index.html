<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แจ้งอาจารย์ GRAS.02</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .toast-enter { animation: slideIn .3s ease-out; }
    @keyframes slideIn { from { transform: translateY(-1rem); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-sky-50 text-slate-800">

  <!-- Toast -->
  <div id="toast" class="fixed top-4 right-4 left-4 sm:left-auto z-50 hidden"></div>

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-600 to-sky-500 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-6">
      <p class="text-indigo-100 text-sm">ระบบแจ้งอาจารย์</p>
      <h1 class="text-2xl sm:text-3xl font-bold leading-tight">GRAS.02 การแต่งตั้งผู้มีความรู้ความเชี่ยวชาญและประสบการณ์สูง</h1>
      <a href="https://lookerstudio.google.com/u/0/reporting/901e903e-65f2-49c3-9654-55b731796e26"
         target="_blank" rel="noopener"
         class="inline-flex items-center gap-1 mt-3 text-sm bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-full transition">
        📊 ดูรายงาน GRAS.02 (Looker Studio) ↗
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 grid gap-8 lg:grid-cols-5">

    <!-- Form -->
    <section class="lg:col-span-2">
      <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-6">
        <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">📝 บันทึกข้อมูล</h2>
        <form id="dataForm" class="space-y-4" novalidate>
          <div>
            <label for="date" class="block text-sm font-medium mb-1">วันที่</label>
            <input type="date" id="date" name="date" required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label for="name" class="block text-sm font-medium mb-1">ชื่อ-นามสกุล <span class="text-rose-500">*</span></label>
            <input type="text" id="name" name="name" required placeholder="เช่น นายสมชาย ใจดี"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label for="details" class="block text-sm font-medium mb-1">รายละเอียด / หมายเหตุ</label>
            <textarea id="details" name="details" rows="4" placeholder="ระบุรายละเอียดการยื่น GRAS.02 หรือข้อความถึงอาจารย์"
                      class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          </div>
          <div>
            <label for="amount" class="block text-sm font-medium mb-1">จำนวนเงิน / ค่าตัวเลข <span class="text-slate-400">(ถ้ามี)</span></label>
            <input type="number" id="amount" name="amount" step="any" min="0" placeholder="0.00"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <button type="submit" id="submitBtn"
                  class="w-full flex justify-center items-center gap-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold py-2.5 rounded-lg shadow transition">
            <span id="btnText">💾 บันทึกข้อมูล</span>
          </button>
        </form>
      </div>
    </section>

    <!-- Table -->
    <section class="lg:col-span-3">
      <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <h2 class="text-lg font-semibold flex items-center gap-2">
            📋 ประวัติข้อมูล
            <span id="count" class="text-xs font-medium bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">0</span>
          </h2>
          <div class="flex gap-2">
            <input type="search" id="search" placeholder="🔍 ค้นหา..."
                   class="flex-1 sm:w-48 rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button id="refreshBtn" title="รีเฟรช"
                    class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm">🔄</button>
          </div>
        </div>
        <p class="text-xs text-slate-400 mb-3">อัปเดตอัตโนมัติทุก 15 วินาที · ล่าสุด <span id="lastUpdated">-</span></p>

        <div class="overflow-x-auto rounded-lg border border-slate-200">
          <table class="min-w-full text-sm">
            <thead class="bg-slate-50 text-slate-600">
              <tr>
                <th class="px-3 py-2 text-left font-semibold whitespace-nowrap">วันที่</th>
                <th class="px-3 py-2 text-left font-semibold whitespace-nowrap">ชื่อ-นามสกุล</th>
                <th class="px-3 py-2 text-left font-semibold">รายละเอียด / หมายเหตุ</th>
                <th class="px-3 py-2 text-right font-semibold whitespace-nowrap">จำนวนเงิน</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100">
              <tr><td colspan="4" class="px-3 py-8 text-center text-slate-400">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const REFRESH_MS = 15000;
    let allRows = [];

    const $ = id => document.getElementById(id);

    function todayISO() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function thaiDate(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
      if (!m) return iso;
      return new Date(+m[1], m[2] - 1, +m[3])
        .toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function formatAmount(v) {
      return v === '' || v == null ? '-' :
        Number(v).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function showToast(message, type = 'success') {
      const colors = type === 'success'
        ? 'bg-emerald-500'
        : 'bg-rose-500';
      const icon = type === 'success' ? '✅' : '⚠️';
      const toast = $('toast');
      toast.innerHTML = `<div class="toast-enter ${colors} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-2">
        <span>${icon}</span><span>${escapeHtml(message)}</span></div>`;
      toast.classList.remove('hidden');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    function renderTable() {
      const q = $('search').value.trim().toLowerCase();
      const rows = q
        ? allRows.filter(r => [r.date, r.name, r.details, r.amount].join(' ').toLowerCase().includes(q))
        : allRows;

      $('count').textContent = rows.length;

      if (!rows.length) {
        $('tableBody').innerHTML = `<tr><td colspan="4" class="px-3 py-8 text-center text-slate-400">
          ${q ? 'ไม่พบข้อมูลที่ค้นหา' : 'ยังไม่มีข้อมูล'}</td></tr>`;
        return;
      }

      $('tableBody').innerHTML = rows.map(r => `
        <tr class="hover:bg-indigo-50/50">
          <td class="px-3 py-2 whitespace-nowrap" title="บันทึกเมื่อ ${escapeHtml(r.timestamp)}">${escapeHtml(thaiDate(r.date))}</td>
          <td class="px-3 py-2 font-medium whitespace-nowrap">${escapeHtml(r.name)}</td>
          <td class="px-3 py-2 whitespace-pre-line text-slate-600">${escapeHtml(r.details) || '-'}</td>
          <td class="px-3 py-2 text-right tabular-nums">${formatAmount(r.amount)}</td>
        </tr>`).join('');
    }

    function loadData() {
      google.script.run
        .withSuccessHandler(rows => {
          allRows = rows || [];
          renderTable();
          $('lastUpdated').textContent = new Date().toLocaleTimeString('th-TH');
        })
        .withFailureHandler(err => showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error'))
        .getData();
    }

    function setLoading(isLoading) {
      $('submitBtn').disabled = isLoading;
      $('btnText').textContent = isLoading ? '⏳ กำลังบันทึก...' : '💾 บันทึกข้อมูล';
    }

    $('dataForm').addEventListener('submit', e => {
      e.preventDefault();
      const form = {
        date: $('date').value,
        name: $('name').value.trim(),
        details: $('details').value.trim(),
        amount: $('amount').value
      };

      if (!form.name) {
        showToast('กรุณากรอกชื่อ-นามสกุล', 'error');
        $('name').focus();
        return;
      }

      setLoading(true);
      google.script.run
        .withSuccessHandler(res => {
          setLoading(false);
          showToast(res.message || 'บันทึกข้อมูลสำเร็จ');
          $('dataForm').reset();
          $('date').value = todayISO();
          loadData();
        })
        .withFailureHandler(err => {
          setLoading(false);
          showToast('บันทึกไม่สำเร็จ: ' + err.message, 'error');
        })
        .saveData(form);
    });

    $('search').addEventListener('input', renderTable);
    $('refreshBtn').addEventListener('click', loadData);

    $('date').value = todayISO();
    loadData();
    setInterval(() => { if (!document.hidden) loadData(); }, REFRESH_MS);
  </script>
</body>
</html>
